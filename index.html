    const today = now.toISOString().slice(0,10);
    const [rm, rt] = await Promise.all([
      fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&language=es-ES&sort_by=popularity.desc&primary_release_date.gte=${firstDay}&primary_release_date.lte=${today}&vote_count.gte=3`).then(r=>r.json()),
      fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&language=es-ES&sort_by=popularity.desc&first_air_date.gte=${firstDay}&first_air_date.lte=${today}&vote_count.gte=3`).then(r=>r.json()),
    ]);
    const pool = [
      ...(r1.results||[]), ...(r2.results||[]),
      ...(rm.results||[]).map(x=>({...x,media_type:'movie'})),
      ...(rt.results||[]).map(x=>({...x,media_type:'tv'})),
    ].filter(x => x.poster_path && (x.media_type === 'movie' || x.media_type === 'tv'));
    // Dedupe by id
    const seen = new Set();
    const items = pool.filter(x => { if (seen.has(x.id)) return false; seen.add(x.id); return true; });
    if (!items.length) return;
    const mt = 'all';
    const chosen = items[Math.floor(Math.random()*items.length)];
    const chosenMt = chosen.media_type || 'movie';

    // Preload backdrop images for the slideshow
    // Use all items shuffled — prefer backdrops but fall back to posters
    const slideItems = [...items].sort(() => Math.random() - .5).slice(0, 20);

    // Build fullscreen overlay — Xbox-style crossfade slideshow
    const overlay = document.createElement('div');
    overlay.style.cssText = `position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer;`;
    // ~580px = 3 cards of ~180px + gaps. Height = 580 * (3/2) = 387 → use 400px
    // 800x411px. Poster: 411*(2/3)=274px wide.
    overlay.innerHTML = `
      <div style="position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);z-index:0;"></div>
      <div id="srBox" style="position:relative;z-index:1;width:800px;max-width:96vw;border-radius:18px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.85);">
        <div id="srBgA" style="position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .55s ease;opacity:0;"></div>
        <div id="srBgB" style="position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .55s ease;opacity:0;"></div>
        <div style="position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.88) 36%,transparent 68%),linear-gradient(to top,rgba(0,0,0,.5) 0%,transparent 40%);"></div>
        <div style="height:411px;"></div>
        <div id="srReveal" style="position:absolute;inset:0;display:flex;align-items:stretch;opacity:0;transition:opacity .5s ease;pointer-events:none;">
          <!-- Left: poster -->
          <div style="flex-shrink:0;width:274px;">
            <img id="srPoster" src="" style="width:274px;height:411px;object-fit:cover;display:block;">
          </div>
          <!-- Right: info -->
          <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 22px 22px 18px;min-width:0;pointer-events:all;">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;">
              <div id="srTitleText" style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;letter-spacing:.04em;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.9);flex:1;min-width:0;"></div>
              
            </div>
            <div id="srYearText" style="font-size:12px;color:rgba(255,255,255,.55);font-family:'DM Sans',sans-serif;margin-bottom:10px;"></div>
            <div id="srOverview" style="font-size:12px;color:rgba(255,255,255,.78);font-family:'DM Sans',sans-serif;line-height:1.55;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;"></div>
            <div style="display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap;">
              <button id="srOpenBtn" style="background:var(--accent);color:#000;border:none;border-radius:8px;padding:9px 22px;font-size:14px;font-family:sans-serif;font-weight:700;cursor:pointer;pointer-events:all;">▶ Abrir</button>
              <button id="srSpinBtn" style="background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:9px 18px;font-size:13px;font-family:sans-serif;font-weight:600;cursor:pointer;pointer-events:all;backdrop-filter:blur(4px);transition:background .15s;">🔀 Volver a girar</button>
            </div>
          </div>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    let cancelled = false;
    overlay.addEventListener('click', (e) => {
      if (e.target.closest('#srBox')) return;
      cancelled = true;
      if (document.body.contains(overlay)) document.body.removeChild(overlay);
    });

    document.getElementById('srOpenBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      cancelled = true;
      if (document.body.contains(overlay)) document.body.removeChild(overlay);
      openDetail({...chosen, media_type: chosenMt || chosen.media_type || 'movie'});
      window.scrollTo({top:0,behavior:'smooth'});
    });

    document.getElementById('srSpinBtn').addEventListener('click', async (e) => {
      e.stopPropagation();
      // Hide reveal panel and re-spin without removing overlay
      const reveal = document.getElementById('srReveal');
      if (reveal) reveal.style.opacity = '0';
      cancelled = true;
      try {
        const page = Math.random() > .5 ? 1 : 2;
        const rb = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_KEY}&language=es-ES&page=${page}`).then(r=>r.json());
        const newPool = (rb.results||[]).filter(x=>x.poster_path&&(x.media_type==='movie'||x.media_type==='tv'));
        if (!newPool.length) return;
        const newChosen = newPool[Math.floor(Math.random()*newPool.length)];
        const newMt = newChosen.media_type || 'movie';
        Object.assign(chosen, newChosen);
        cancelled = false;
        slideItems.splice(0, slideItems.length, ...[newChosen, ...slideItems].sort(()=>Math.random()-.5).slice(0,20));
        slideIdx = 0; si = 0; useA = true;
        showSlide(0);
        const spinFast = setInterval(() => {
          if (cancelled || si >= 11) { clearInterval(spinFast); return; }
          showSlide(slideIdx); si++;
        }, 220);
        setTimeout(() => {
          if (cancelled) return;
          clearInterval(spinFast);
          let si2 = 0;
          const spinSlow = setInterval(() => {
            if (cancelled || si2 >= 3) { clearInterval(spinSlow); return; }
            showSlide(slideIdx); si2++;
          }, 450);
          setTimeout(() => {
            if (cancelled) return;
            clearInterval(spinSlow);
            const finalUrl = newChosen.backdrop_path
              ? `https://image.tmdb.org/t/p/w1280${newChosen.backdrop_path}`
              : `https://image.tmdb.org/t/p/w500${newChosen.poster_path}`;
            bgA.style.backgroundImage = `url('${finalUrl}')`;
            bgA.style.opacity = '1'; bgB.style.opacity = '0';
            setTimeout(() => {
              if (cancelled) return;
              document.getElementById('srPoster').src = `https://image.tmdb.org/t/p/w342${newChosen.poster_path}`;
              document.getElementById('srTitleText').textContent = newChosen.title || newChosen.name || '';
              const yr = (newChosen.release_date||newChosen.first_air_date||'').slice(0,4);
              document.getElementById('srYearText').textContent = [yr, newMt==='tv'?'Serie':'Película', newChosen.vote_average?'★ '+newChosen.vote_average.toFixed(1):''].filter(Boolean).join(' · ');
              const ov = document.getElementById('srOverview');
              if (ov) ov.textContent = newChosen.overview || '';
              if (reveal) reveal.style.opacity = '1';
              document.getElementById('srOpenBtn').onclick = (ev) => {
                ev.stopPropagation();
                cancelled = true;
                if (document.body.contains(overlay)) document.body.removeChild(overlay);
                openDetail({...newChosen, media_type: newMt});
                window.scrollTo({top:0,behavior:'smooth'});
              };
            }, 300);
          }, 1300);
        }, 1500);
      } catch(err) { console.error(err); }
    });

    // Crossfade slideshow
    const bgA = document.getElementById('srBgA');
    const bgB = document.getElementById('srBgB');
    let slideIdx = 0;
    let useA = true;

    function getImgUrl(item) {
      // For the compact box, w780 backdrops are fine and load faster
      if (item.backdrop_path) return `https://image.tmdb.org/t/p/w780${item.backdrop_path}`;
      return `https://image.tmdb.org/t/p/w342${item.poster_path}`;
    }

    function showSlide(idx) {
      if (cancelled) return;
      const item = slideItems[idx % slideItems.length];
      const url = getImgUrl(item);
      if (useA) {
        bgA.style.backgroundImage = `url('${url}')`;
        bgA.style.opacity = '1';
        bgB.style.opacity = '0';
      } else {
        bgB.style.backgroundImage = `url('${url}')`;
        bgB.style.opacity = '1';
        bgA.style.opacity = '0';
      }
      useA = !useA;
      slideIdx++;
    }

    // Start slideshow - fast at first, slow down
    showSlide(0);
    const slideIntervals = [];
    // First 2.5s: fast (220ms each) → more images
    let si = 0;
    const fastSlide = setInterval(() => {
      if (cancelled || si >= 11) { clearInterval(fastSlide); return; }
      showSlide(slideIdx);
      si++;
    }, 220);
    slideIntervals.push(fastSlide);

    // 2.5–3.8s: slow down (450ms each)
    setTimeout(() => {
      if (cancelled) return;
      clearInterval(fastSlide);
      let si2 = 0;
      const slowSlide = setInterval(() => {
        if (cancelled || si2 >= 3) { clearInterval(slowSlide); return; }
        showSlide(slideIdx);
        si2++;
      }, 450);
      slideIntervals.push(slowSlide);
    }, 1500);

    // 3.8s: show chosen as final + reveal panel
    setTimeout(() => {
      if (cancelled) return;
      slideIntervals.forEach(i => clearInterval(i));
      // Final slide = chosen backdrop
      const finalUrl = chosen.backdrop_path
        ? `https://image.tmdb.org/t/p/w1280${chosen.backdrop_path}`
        : `https://image.tmdb.org/t/p/w500${chosen.poster_path}`;
      bgA.style.backgroundImage = `url('${finalUrl}')`;
      bgA.style.opacity = '1';
      bgB.style.opacity = '0';

      // Reveal info panel
      setTimeout(() => {
        if (cancelled) return;
        const rev = document.getElementById('srReveal');
        const poster = document.getElementById('srPoster');
        const titleEl = document.getElementById('srTitleText');
        const yearEl = document.getElementById('srYearText');
        poster.src = `https://image.tmdb.org/t/p/w342${chosen.poster_path}`;
        titleEl.textContent = chosen.title || chosen.name || '';
        const yr = (chosen.release_date || chosen.first_air_date || '').slice(0,4);
        const type = chosenMt === 'tv' ? 'Serie' : 'Película';
        yearEl.textContent = [yr, type, chosen.vote_average ? '★ '+chosen.vote_average.toFixed(1) : ''].filter(Boolean).join(' · ');
        const overviewEl = document.getElementById('srOverview');
        if (overviewEl) overviewEl.textContent = chosen.overview || '';
        rev.style.opacity = '1';
        // Load trailer
        const trailerBtn = document.getElementById('srTrailerBtn');
        if (trailerBtn) {
          fetch(`https://api.themoviedb.org/3/${chosenMt}/${chosen.id}/videos?api_key=${TMDB_KEY}&language=es-ES`)
            .then(r=>r.json()).then(d => {
              let v = (d.results||[]).find(x=>x.type==='Trailer'&&x.site==='YouTube');
              if (!v) v = (d.results||[]).find(x=>x.site==='YouTube');
              if (v) {
                trailerBtn.style.display = 'inline-flex';
                trailerBtn.addEventListener('click', (e) => {
                  e.stopPropagation();
                  window.open(`https://www.youtube.com/watch?v=${v.key}`, '_blank');
                });
              }
            }).catch(()=>{});
        }
      }, 300);
    }, 3800);

    // No auto-open — user must click the button

  } catch(e) { console.error(e); }
}

function showToast(msg, duration=3000) {
  const existing = document.getElementById('movToast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.id = 'movToast';
  t.textContent = msg;
  t.style.cssText = `position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
    background:var(--bg3);color:var(--t1);padding:10px 20px;border-radius:20px;
    border:1px solid var(--border2);font-family:'DM Sans',sans-serif;font-size:13px;
    z-index:9998;box-shadow:0 4px 16px rgba(0,0,0,.4);animation:fadeDown .2s ease;
    white-space:nowrap;`;
  document.body.appendChild(t);
  setTimeout(() => t.style.opacity='0', duration-300);
  setTimeout(() => t.remove(), duration);
}

function openFromHistorial() {
  // Re-open current detail without historial mode
  const id = currentDetailId;
  const mt = currentDetailType || currentMediaType;
  const poster = currentDetailPoster;
  const title = currentDetailTitle;
  if (!id) return;
  window._fromHistorial = false;
  openDetail({
    id, media_type: mt, poster_path: poster,
    title: mt === 'movie' ? title : undefined,
    name: mt === 'tv' ? title : undefined
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

}

function renderResultPlatforms(title) {
  const container = document.getElementById('resultPlatforms');
  if (!container) return;
  const searchTitle = currentDetailOriginal || title;
  const q = encodeURIComponent(searchTitle);
  const q_es = title.trim().replace(/\s+/g, '+');
  const slug = title.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\s-]/g, '')
    .trim().replace(/\s+/g, '-');
  const type = currentMediaType === 'tv' ? 'serie' : 'pelicula';

  const legalDomains = new Set(['netflix.com','primevideo.com','disneyplus.com','max.com','tv.apple.com','paramountplus.com','starplus.com','movistarplus.es','clarovideo.com','crunchyroll.com']);
  const unofficialDomains = new Set(['pelisflix1.homes','cuevana.bi','hdfull.org','pelisplushd.ms','pelispedia.mov','seriesflixhd.shop']);
  const legalPlatforms = platforms.filter(p => legalDomains.has(p.domain));
  const unofficialPlatforms = platforms.filter(p => unofficialDomains.has(p.domain));

  const faviconOverrides = {
    'pelisflix1.homes': 'https://s.pelisflix1.homes/flix/imgs/cropped-1F17F-p-button-128-32x32.png',
    'pelisplushd.ms':   'https://image.winudf.com/v2/image1/cGVsaXNwbHVzLmFwbGlrZnRfaWNvbl8xNjQyOTc5Mjg3XzA1Nw/icon.webp?w=140&fakeurl=1&type=.webp',
  };

  container.innerHTML = legalPlatforms.map(p => {
    const url = p.url.replace('{q}', q).replace('{q_es}', q_es).replace('{slug}', slug).replace('{type}', type);
    const fav = faviconOverrides[p.domain] || `https://www.google.com/s2/favicons?sz=64&domain=${p.domain}`;
    return `<a class="rp-btn" href="${url}" target="_blank" title="${p.name}">
      <img src="${fav}" alt="${p.name}">
      <span>${p.name}</span>
    </a>`;
  }).join('') + `
  <div style="position:relative;display:inline-block;" id="pirateMenuWrap">
    <button class="rp-btn" onclick="togglePirateMenu()" title="Plataformas alternativas">
      <span style="font-size:22px;line-height:34px;display:block;width:34px;height:34px;text-align:center;">☠️</span>
    </button>
    <div id="pirateMenu" style="display:none;position:absolute;bottom:calc(100% + 8px);left:0;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:10px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.5);min-width:max-content;">
      <div style="font-size:9px;color:var(--t3);font-family:'DM Mono',monospace;letter-spacing:.1em;padding:0 2px 8px;text-transform:uppercase;">Alternativas</div>
      <div id="pirateMenuItems" style="display:flex;gap:6px;flex-wrap:nowrap;"></div>
    </div>
  </div>`;

  const pirateItems = unofficialPlatforms.map(p => {
    const url = p.url.replace('{q}', q).replace('{q_es}', q_es).replace('{slug}', slug).replace('{type}', type);
    const fav = faviconOverrides[p.domain] || `https://www.google.com/s2/favicons?sz=64&domain=${p.domain}`;
    const action = p.noEmbed
      ? `document.getElementById('pirateMenu').style.display='none';window.open('${url.replace(/'/g,"\\'")}','_blank')`
      : `document.getElementById('pirateMenu').style.display='none';openEpisodePlayer('${url.replace(/'/g,"\\'")}','${(currentDetailTitle||'').replace(/'/g,"\\'")}','${p.name}')`;
    return `<button onclick="${action}" title="${p.name}"
      style="background:var(--bg3);border:1px solid var(--border2);border-radius:14px;padding:7px 10px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;"
      onmouseover="this.style.background='var(--acc-lo)';this.style.borderColor='var(--accent)';this.style.transform='translateY(-1px)'"
      onmouseout="this.style.background='var(--bg3)';this.style.borderColor='var(--border2)';this.style.transform=''">
      <img src="${fav}" alt="${p.name}" style="width:34px;height:34px;border-radius:9px;object-fit:cover;display:block;">
    </button>`;
  }).join('');
  setTimeout(() => { const el = document.getElementById('pirateMenuItems'); if (el) el.innerHTML = pirateItems; }, 0);
}

// ── Open a single item detail (movie, series, or person) ──────────────────
async function openDetail(item) {
  const container = document.getElementById('container');
  container.innerHTML = '<div class="state-msg"><div class="spinner"></div> Cargando…</div>';
  currentTrailerKey = null;
  if (!window._fromHistorial) window._fromHistorial = false;

  // Personas: flujo separado sin try compartido con mt
  if (item._isPerson) {
    pushHistory({ type: 'detail', item: Object.assign({}, item, { _isPerson: true }) });
    await renderPersonCard(item);
    return;
  }

  try {
    const _dummy = null; // separador

    const mt = item.media_type || item._mt || 'movie';
    currentMediaType = mt;

    if (mt === 'tv') {
      item.title = item.name || item.original_name || item.title;
      item.release_date = item.first_air_date || item.release_date;
    }

    const year   = parseInt((item.release_date||'').slice(0,4)) || 0;
    const rating = item.vote_average ? item.vote_average.toFixed(1) : '—';
    const poster = item.poster_path ? TMDB_IMG + item.poster_path : '';
    const q      = encodeURIComponent(item.title || '');

    let seasons = null;
    if (mt === 'tv') {
      const det = await tmdbSeriesDetails(item.id);
      seasons = det.number_of_seasons || null;
    }

    const detFull = await fetch(`https://api.themoviedb.org/3/${mt}/${item.id}?api_key=${TMDB_KEY}&language=es-ES`).then(r=>r.json());
    const genres = detFull.genres || [];
    const backdropPath = detFull.backdrop_path || item.backdrop_path || '';

    currentMediaIdForRecs = item.id;
    currentDetailId       = item.id;
    currentDetailTitle    = item.title || item.name || '';
    currentDetailOriginal = detFull.original_title || detFull.original_name || item.title || item.name || '';
    currentDetailPoster   = item.poster_path || '';
    currentDetailYear     = String(year);
    currentDetailType     = mt;
    document.title = `${currentDetailTitle} (${mt === 'tv' ? 'Serie' : 'Película'}) — Movara`;
    recsLoaded = false;
    recsVisible = false;
    recsPage = 1;
    recsAllItems = [];
    // Enrich item with full details for synopsis/rating
    item._overview = detFull.overview || item.overview || '';
    item.overview  = item._overview;
    item.vote_average = item.vote_average || detFull.vote_average;
    pushHistory({ type: 'detail', item: { ...item } });
    container.innerHTML = buildCard(item, poster, year, rating, q, seasons, genres, window._fromHistorial);

    if (backdropPath) {
      const bdEl = document.getElementById('movieBackdrop');
      const fadeEl = document.getElementById('movieBackdropFade');
      if (bdEl) {
        bdEl.style.backgroundImage = `url('https://image.tmdb.org/t/p/w1280${backdropPath}')`;
      }
    }
    updateFavBtn(item.id);
    loadTrailer(item.id, item.title, backdropPath);
    if (!window._fromHistorial) {
      renderResultPlatforms(item.title);
      loadStreamingBanner(item.id, mt);
    }
    // "La vi" button: movies only, not from historial (they're already there)
    const mwb = document.getElementById('markWatchedBtn');
    if (mwb) {
      if (!window._fromHistorial && mt === 'movie') {
        // Check if already in historial
        const hist = getHistorial();
        const alreadyWatched = hist.some(h => h.id === item.id && h.type === 'movie');
        mwb.style.display = 'flex';
        updateMarkWatchedBtn(alreadyWatched);
      } else {
        mwb.style.display = 'none';
      }
    }
    loadCast(item.id, window._fromHistorial);
    setTimeout(updateAlertBtn, 100);
    // Capture historial mode before reset, pass to loadSeasons
    const _histMode = !!window._fromHistorial;
    window._fromHistorial = false;
    if (mt === 'tv' && seasons) {
      loadSeasons(item.id, seasons, _histMode);
    }
  } catch(err) {
    container.innerHTML = `<div class="state-msg" style="color:#f88">Error al cargar. Intentá de nuevo.</div>`;
    console.error(err);
  }
}

// ── Search → show results grid ────────────────────────────────────────────
let _searchPage = 1;
let _lastSearchTitle = '';

async function search() {
  const title = document.getElementById('q').value.trim();
  const yearVal = document.getElementById('yearFilter')?.value?.trim() || '';
  window._searchYear = yearVal ? parseInt(yearVal) : null;
  if (!title && !yearVal) return;
  _lastSearchTitle = title || '';
  _searchPage = 1;
  const container = document.getElementById('container');
  const displayLabel = title + (yearVal ? ' (' + yearVal + ')' : '');
  container.innerHTML = `<div class="state-msg"><div class="spinner"></div> Buscando "${displayLabel}"…</div>`;
  // Clear year filter text after search
  const yf = document.getElementById('yearFilter');
  if (yf) { yf.value = ''; yf.style.borderColor = 'var(--border2)'; }

  try {
    // Year-only: use discover
    if (!title && window._searchYear) {
      const yr = window._searchYear;
      const [rm, rt] = await Promise.all([
        fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&language=es-ES&primary_release_year=${yr}&sort_by=popularity.desc&page=1`).then(r=>r.json()),
        fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&language=es-ES&first_air_date_year=${yr}&sort_by=popularity.desc&page=1`).then(r=>r.json()),
      ]);
      const results = [
        ...(rm.results||[]).map(x=>({...x,media_type:'movie'})),
        ...(rt.results||[]).map(x=>({...x,media_type:'tv'})),
      ].filter(x=>x.poster_path);
      if (browseSort === 'year') {
        results.sort((a,b) => ((b.release_date||b.first_air_date||'')).localeCompare((a.release_date||a.first_air_date||'')));
      } else {
        results.sort((a,b) => (b.popularity||0)-(a.popularity||0));
      }
      if (!results.length) { container.innerHTML = `<div class="state-msg">No se encontraron resultados para el año ${yr}.</div>`; return; }
      renderSearchResults(results, `Año ${yr}`, results.length >= 20);
      return;
    }

    const [multiR, personR] = await Promise.all([
      fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&language=es-ES&query=${encodeURIComponent(title)}&include_adult=false&page=1`).then(r=>r.json()),
      fetch(`https://api.themoviedb.org/3/search/person?api_key=${TMDB_KEY}&language=es-ES&query=${encodeURIComponent(title)}&page=1`).then(r=>r.json()),
    ]);

    let allResults = multiR.results || [];
    // Filter by year if set
    if (window._searchYear) {
      allResults = allResults.filter(x => {
        const y = parseInt((x.release_date||x.first_air_date||'').slice(0,4));
        return y === window._searchYear;
      });
    }
    const topPerson = personR.results?.[0] || null;
    const topMulti  = allResults[0] || null;

    // Check if top result is a strong person match
    let personFirst = false;
    if (topPerson && topPerson.profile_path) {
      if (!topMulti || topMulti.media_type === 'person') {
        personFirst = true;
      } else {
        personFirst = (topPerson.popularity||0) >= (topMulti.popularity||0) * 0.6;
      }
    }

    if (!allResults.length && !topPerson) {
      container.innerHTML = `<div class="state-msg">No se encontró "${title}".</div>`;
      return;
    }

    // Build unified result list
    let items = [];
    if (personFirst && topPerson) {
      topPerson._isPerson = true;
      items.push(topPerson);
    }
    allResults.forEach(r => {
      if (r.media_type === 'person') {
        if (!personFirst || r.id !== topPerson?.id) {
          r._isPerson = true; items.push(r);
        }
      } else if (r.media_type === 'movie' || r.media_type === 'tv') {
        r.title = r.title || r.name || r.original_name;
        r.release_date = r.release_date || r.first_air_date;
        items.push(r);
      }
    });

    pushHistory({ type: 'search', query: title });
    renderSearchResults(items, title, multiR.total_pages > 1);
  } catch(err) {
    container.innerHTML = `<div class="state-msg" style="color:#f88">Error al buscar. Intentá de nuevo.</div>`;
    console.error(err);
  }
}

async function loadMoreSearchResults() {
  _searchPage++;
  const r = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&language=es-ES&query=${encodeURIComponent(_lastSearchTitle)}&include_adult=false&page=${_searchPage}`).then(r=>r.json());
  const items = (r.results||[]).filter(x => x.media_type !== 'person' || x.profile_path).map(x => {
    if (x.media_type === 'person') x._isPerson = true;
    else { x.title = x.title||x.name; x.release_date = x.release_date||x.first_air_date; }
    return x;
  });
  const grid = document.getElementById('searchResultsGrid');
  if (grid) renderSearchResultCards(grid, items);
  const btn = document.getElementById('searchShowMore');
  if (btn) btn.style.display = _searchPage < r.total_pages ? 'block' : 'none';
}

function renderSearchResults(items, title, hasMore) {
  const container = document.getElementById('container');
  container.innerHTML = `
  <div class="home-section">
    <div class="search-results-header">
      <div class="search-results-title">Resultados para <span>"${title}"</span></div>
    </div>
    <div class="browse-grid" id="searchResultsGrid"></div>
    <div style="text-align:center;margin-top:18px;display:${hasMore?'block':'none'};" id="searchShowMore">
      <button class="home-tab" onclick="loadMoreSearchResults()" style="margin:0 auto;">Mostrar más</button>
    </div>
  </div>`;
  const grid = document.getElementById('searchResultsGrid');
  renderSearchResultCards(grid, items);
}

function renderSearchResultCards(grid, items) {
  items.filter(x => x.poster_path || x.profile_path).forEach(item => {
    const isPerson = item._isPerson;
    const title = item.title || item.name || '—';
    const year = (item.release_date || item.first_air_date || '').slice(0,4);
    const overview = item.overview || item.known_for_department || '';
    const rating = item.vote_average ? item.vote_average.toFixed(1) : '—';
    const imgPath = item.poster_path || item.profile_path;
    const type = isPerson ? 'Persona' : (item.media_type === 'tv' ? 'Serie' : 'Película');

    const card = document.createElement('div');
    card.className = 'browse-card';
    card.innerHTML = `
      <img src="https://image.tmdb.org/t/p/w342${imgPath}" alt="${title}" loading="lazy">
      <div class="browse-card-body">
        <div class="browse-card-title">${title}</div>
        ${year ? `<span class="browse-card-year">${year}</span>` : ''}
      </div>
      <div class="browse-card-tooltip">
        <div class="bct-title">${title}</div>
        <div class="bct-meta">${isPerson ? type : (rating+'/10 · '+year+' · '+type)}</div>
        <div class="bct-overview">${overview.slice(0,200)}</div>
      </div>`;
    card.addEventListener('click', () => openDetail(item));
    grid.appendChild(card);
  });
}

function handleLogin() {
  if (window._fbUser) {
    if (confirm('¿Cerrar sesión?')) window._fbSignOut && window._fbSignOut();
  } else {
    window._fbSignIn && window._fbSignIn().catch(e => alert('Error al iniciar sesión: ' + e.message));
  }
}

function getFavorites() {
  if (window._fbUser && window._cloudFavs) return window._cloudFavs;
  try { return JSON.parse(localStorage.getItem('favorites_v1') || '[]'); } catch(e) { return []; }
}

async function saveFavorites(list) {
  // Always save to localStorage as backup
  localStorage.setItem('favorites_v1', JSON.stringify(list));
  // Sync to Firestore if logged in
  if (window._fbUser && window._fbDb && window._fbDoc && window._fbSetDoc) {
    try {
      const ref = window._fbDoc(window._fbDb, 'favorites', window._fbUser.uid);
      await window._fbSetDoc(ref, { items: list });
      window._cloudFavs = [...list]; // update in-memory cache
      console.log('✅ Favoritos sincronizados en Firebase:', list.length);
    } catch(e) {
      console.error('❌ Error guardando en Firebase:', e.code, e.message);
    }
  }
}

async function toggleFavorite() {
  if (!currentDetailId) return;
  const favs = getFavorites();
  const idx = favs.findIndex(f => f.id === currentDetailId);
  const btn = document.getElementById('favBtn');
  if (idx >= 0) {
    // Quitar de favoritos Y de seguimiento
    favs.splice(idx, 1);
    if (btn) btn.classList.remove('active');
    const alerts = getAlerts().filter(a => !(a.id === currentDetailId && a.type === currentDetailType));
    saveAlerts(alerts);
  } else {
    // Agregar a favoritos Y activar seguimiento automáticamente
    favs.push({
      id: currentDetailId,
      title: currentDetailTitle,
      poster: currentDetailPoster,
      year: currentDetailYear,
      type: currentDetailType,
      addedAt: Date.now()
    });
    if (btn) btn.classList.add('active');
    const alerts = getAlerts();
    if (!alerts.some(a => a.id === currentDetailId && a.type === currentDetailType)) {
      alerts.push({
        id: currentDetailId,
        type: currentDetailType,
        title: currentDetailTitle,
        poster: currentDetailPoster,
        addedAt: new Date().toISOString()
      });
      saveAlerts(alerts);
      // Marcar el momento actual para detectar novedades desde ahora
      localStorage.setItem(`movara_alert_last_${currentDetailId}`, new Date().toISOString());
    }
  }
  await saveFavorites(favs);
}

        position:absolute;top:6px;right:6px;z-index:10;

    grid.appendChild(card);

}

async function clearAllFavs() {

  await saveFavorites([]);
  showFavorites();
}

  });
  if (type === 'movie')      document.getElementById('tabMovie')?.classList.add('active');

// ── loadHomeGrid ─────────────────────────────────────────
async function loadHomeGrid(append = false) {
  const grid = document.getElementById('browseGrid');
  if (!grid) return;
  if (!append) { grid.innerHTML = '<div class="ep-loading">Cargando…</div>'; homePage = 1; }
  try {
    if (homeType === 'categories') {
      grid.innerHTML = '';
      renderCategoriesGrid(grid);
      return;
    }
    if (homeType === 'home') {
      const url = `https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_KEY}&language=es-ES&page=${homePage}`;
      const r = await fetch(url); const d = await r.json();
      if (!append) grid.innerHTML = '';
      const releaseIds = window._releaseIds || new Set();
      const filtered = (d.results||[]).filter(x => !releaseIds.has(x.id) && x.poster_path);
      renderBrowseGrid(grid, filtered, null, 'browseShowMore');
      return;
    }
    // movie or tv — full catalog
    const sortField = homeSort === 'popularity' ? 'popularity.desc'
      : (homeType === 'tv' ? 'first_air_date.desc' : 'release_date.desc');
    const url = `https://api.themoviedb.org/3/discover/${homeType}?api_key=${TMDB_KEY}&language=es-ES&sort_by=${sortField}&page=${homePage}&vote_count.gte=5`;
    const r = await fetch(url); const d = await r.json();
    if (!append) grid.innerHTML = '';
    renderBrowseGrid(grid, (d.results||[]).filter(x=>x.poster_path), homeType, 'browseShowMore');
  } catch(e) { grid.innerHTML = '<div class="ep-loading">Error al cargar.</div>'; }
}

// ── loadReleasesGrid ─────────────────────────────────────
async function loadReleasesGrid() {
  const grid = document.getElementById('releasesGrid');
  if (!grid) return;
  try {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth()+1).padStart(2,'0');
    const firstDay = `${y}-${m}-01`;
    const today = now.toISOString().slice(0,10);
    const [rm, rt] = await Promise.all([
      fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&language=es-ES&sort_by=popularity.desc&primary_release_date.gte=${firstDay}&primary_release_date.lte=${today}&vote_count.gte=3`).then(r=>r.json()),
      fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&language=es-ES&sort_by=popularity.desc&first_air_date.gte=${firstDay}&first_air_date.lte=${today}&vote_count.gte=3`).then(r=>r.json()),
    ]);
    const mixed = [
      ...(rm.results||[]).map(x=>({...x,media_type:'movie'})),
      ...(rt.results||[]).map(x=>({...x,media_type:'tv'})),
    ].filter(x=>x.poster_path).sort((a,b)=>(b.popularity||0)-(a.popularity||0)).slice(0,18);
    window._releaseIds = new Set(mixed.map(x=>x.id));
    grid.innerHTML = '';
    if (!mixed.length) { grid.innerHTML = '<div class="ep-loading">Sin estrenos este mes todavía.</div>'; return; }
    renderBrowseGrid(grid, mixed, null, null);
  } catch(e) { grid.innerHTML = '<div class="ep-loading">Error al cargar estrenos.</div>'; }
}

// ── loadBrowseGrid ───────────────────────────────────────
async function loadBrowseGrid(append = false) {
  if (!browseState) return;
  const {mode, value} = browseState;
  const grid = document.getElementById('browseGrid2');
  if (!grid) return;
  if (!append) { grid.innerHTML = '<div class="ep-loading">Cargando…</div>'; browsePage = 1; }
  try {
    const sortBy = browseSort === 'year' ? 'release_date.desc' : 'popularity.desc';
    const sortByTv = browseSort === 'year' ? 'first_air_date.desc' : 'popularity.desc';
    // For provider mode: fetch both movie+tv in parallel
    if (mode === 'provider') {
      const ids = value; // may contain pipe: "384|1825"
      const [rm, rt] = await Promise.all([
        fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&language=es-ES&with_watch_providers=${encodeURIComponent(ids)}&watch_region=AR&sort_by=${sortBy}&page=${browsePage}`).then(r=>r.json()),
        fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&language=es-ES&with_watch_providers=${encodeURIComponent(ids)}&watch_region=AR&sort_by=${sortByTv}&page=${browsePage}`).then(r=>r.json()),
      ]);
      const results = [
        ...(rm.results||[]).map(x=>({...x,media_type:'movie'})),
        ...(rt.results||[]).map(x=>({...x,media_type:'tv'})),
      ].filter(x=>x.poster_path);
      if (browseSort === 'year') {
        results.sort((a,b) => ((b.release_date||b.first_air_date||'')).localeCompare((a.release_date||a.first_air_date||'')));
      } else {
        results.sort((a,b) => (b.popularity||0)-(a.popularity||0));
      }
      if (!append) grid.innerHTML = '';
      if (!results.length) { grid.innerHTML = '<div class="ep-loading">Sin resultados para esta plataforma en Argentina.</div>'; return; }
      renderBrowseGrid(grid, results, null, 'browseShowMore2');
      return;
    }
    // Anime mode: fetch movie+tv con genre=16 y keyword=210024
    if (mode === 'anime') {
      const [rm, rt] = await Promise.all([
        fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&language=es-ES&with_genres=16&with_keywords=210024&sort_by=popularity.desc&page=${browsePage}`).then(r=>r.json()),
        fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&language=es-ES&with_genres=16&with_keywords=210024&sort_by=popularity.desc&page=${browsePage}`).then(r=>r.json()),
      ]);
      const results = [...(rm.results||[]).map(x=>({...x,_mt:'movie'})),...(rt.results||[]).map(x=>({...x,_mt:'tv'}))].filter(x=>x.poster_path).sort((a,b)=>(b.popularity||0)-(a.popularity||0));
      if (!append) grid.innerHTML = '';
      renderBrowseGrid(grid, results, null, 'browseShowMore2');
      return;
    }
    // genre, year, type modes — fetch movie+tv
    let mediaTypes = mode === 'type' ? [value] : ['movie','tv'];
    if (mode === 'anime') {
      const [rm, rt] = await Promise.all([
        fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&language=es-ES&with_genres=16&with_keywords=210024&sort_by=${sortBy}&page=${browsePage}`).then(r=>r.json()),
        fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&language=es-ES&with_genres=16&with_keywords=210024&sort_by=${sortByTv}&page=${browsePage}`).then(r=>r.json()),
      ]);
      let animeResults = [...(rm.results||[]).map(x=>({...x,_mt:'movie'})),...(rt.results||[]).map(x=>({...x,_mt:'tv'}))].filter(x=>x.poster_path);
      if (browseSort === 'year') animeResults.sort((a,b)=>((b.release_date||b.first_air_date||'')).localeCompare((a.release_date||a.first_air_date||'')));
      else animeResults.sort((a,b)=>(b.popularity||0)-(a.popularity||0));
      if (!append) grid.innerHTML = '';
      renderBrowseGrid(grid, animeResults, null, 'browseShowMore2');
      return;
    }
    const MOVIE_TO_TV_GENRE = {'28':'10759','878':'10765','14':'10765','10752':'10768','27':'9648','53':'9648','12':'10759','10402':'10402'};
    let results = [];
    for (const mt of mediaTypes) {
      // Use correct sort field per media type
      const dateSortField = mt === 'tv' ? 'first_air_date.desc' : 'release_date.desc';
      const mtSortBy = browseSort === 'year' ? dateSortField : 'popularity.desc';
      let url;
      if (mode === 'genre') {
        const genreId = (mt === 'tv' && MOVIE_TO_TV_GENRE[value]) ? MOVIE_TO_TV_GENRE[value] : value;
        url = `https://api.themoviedb.org/3/discover/${mt}?api_key=${TMDB_KEY}&language=es-ES&with_genres=${genreId}&sort_by=${mtSortBy}&page=${browsePage}`;
      } else if (mode === 'year') {
        const yf = mt === 'movie' ? 'primary_release_year' : 'first_air_date_year';
        url = `https://api.themoviedb.org/3/discover/${mt}?api_key=${TMDB_KEY}&language=es-ES&${yf}=${value}&sort_by=${mtSortBy}&page=${browsePage}`;
      } else {
        url = `https://api.themoviedb.org/3/discover/${mt}?api_key=${TMDB_KEY}&language=es-ES&sort_by=${mtSortBy}&page=${browsePage}`;
      }
      const d = await fetch(url).then(r=>r.json());
      (d.results||[]).forEach(x=>{ x._mt = mt; });
      results.push(...(d.results||[]));
    }
    results = results.filter(x=>x.poster_path);
    // Sort combined results correctly
    if (browseSort === 'year') {
      results.sort((a,b) => {
        const da = (a.release_date||a.first_air_date||'');
        const db = (b.release_date||b.first_air_date||'');
        return db.localeCompare(da);
      });
    } else {
      results.sort((a,b)=>(b.popularity||0)-(a.popularity||0));
    }
    if (!append) grid.innerHTML = '';
    renderBrowseGrid(grid, results, null, 'browseShowMore2');
  } catch(e) { grid.innerHTML = '<div class="ep-loading">Error al cargar.</div>'; }
}

// ── renderCategoriesGrid ─────────────────────────────────
function renderBrowseGrid(grid, items, forceType, showMoreBtnId) {
  if (!items || !items.length) return;
  items.forEach(item => {
    const mt = forceType || item.media_type || item._mt || 'movie';
    const title = item.title || item.name || '—';
    const year = (item.release_date || item.first_air_date || '').slice(0,4);
    const rating = item.vote_average ? item.vote_average.toFixed(1) : '—';
    const card = document.createElement('a');
    card.className = 'browse-card';
    card.href = `?id=${item.id}&type=${mt}`;
    card.innerHTML = `
      <img src="https://image.tmdb.org/t/p/w342${item.poster_path}" alt="${title}" loading="lazy">
      <div class="browse-card-body">
        <div class="browse-card-title">${title}</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;">
          ${year ? `<span class="browse-card-year">${year}</span>` : ''}
          <span class="browse-card-year">${mt === 'tv' ? 'Serie' : 'Película'}</span>
          ${rating !== '—' ? `<span class="browse-card-year" style="background:#2d2a00;color:#e8c547;">★ ${rating}</span>` : ''}
        </div>
      </div>
      <div class="browse-card-tooltip">
        <div class="bct-title">${title}</div>
        <div class="bct-meta">${year}${rating !== '—' ? ' · ★ '+rating : ''}</div>
        <div class="bct-overview">${(item.overview||'').slice(0,120)}${(item.overview||'').length>120?'…':''}</div>
      </div>`;
    card.addEventListener('click', (e) => {
      if (e.ctrlKey || e.metaKey || e.button === 1) return;
      e.preventDefault();
      const obj = {...item, media_type: mt};
      openDetail(obj);
      window.scrollTo({top:0, behavior:'smooth'});
    });
    grid.appendChild(card);
  });
  // show/hide "Ver más" button
  if (showMoreBtnId) {
    const btn = document.getElementById(showMoreBtnId);
    if (btn) btn.style.display = items.length > 0 ? 'block' : 'none';
  }
}

// ── AUTOCOMPLETE ──────────────────────────────────────────
let _acTimer = null;
let _acActive = -1;

function initAutocomplete() {
  const inp = document.getElementById('q');
  const list = document.getElementById('acList');
  if (!inp || !list) return;

  inp.addEventListener('input', () => {
    clearTimeout(_acTimer);
    const q = inp.value.trim();
    if (q.length < 2) { list.style.display = 'none'; return; }
    _acTimer = setTimeout(() => fetchAutocomplete(q), 220);
  });

  inp.addEventListener('keydown', (e) => {
    const items = list.querySelectorAll('.autocomplete-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      _acActive = Math.min(_acActive + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('active', i === _acActive));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      _acActive = Math.max(_acActive - 1, -1);
      items.forEach((el, i) => el.classList.toggle('active', i === _acActive));
    } else if (e.key === 'Enter') {
      if (_acActive >= 0 && items[_acActive]) {
        items[_acActive].click();
      }
      list.style.display = 'none';
    } else if (e.key === 'Escape') {
      list.style.display = 'none';
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#q') && !e.target.closest('#acList') && !e.target.closest('.search-row-new')) {
      list.style.display = 'none';
    }
  });
}

async function fetchAutocomplete(q) {
  const list = document.getElementById('acList');
  if (!list) return;
  try {
    const r = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&language=es-ES&query=${encodeURIComponent(q)}&page=1`);
    const d = await r.json();
    const items = (d.results || [])
      .filter(x => {
        if (x.media_type === 'movie' || x.media_type === 'tv') return x.poster_path || x.backdrop_path;
        if (x.media_type === 'person') return x.profile_path;
        return false;
      })
      .slice(0, 6);
    if (!items.length) { list.style.display = 'none'; return; }
    _acActive = -1;
    list.innerHTML = items.map((item, i) => {
      const isPerson = item.media_type === 'person';
      const title = item.title || item.name || '';
      const year = (item.release_date || item.first_air_date || '').slice(0,4);
      const type = isPerson ? '👤 Persona' : item.media_type === 'tv' ? 'Serie' : 'Película';
      const imgPath = isPerson ? item.profile_path : item.poster_path;
      const img = imgPath
        ? `<img src="https://image.tmdb.org/t/p/w92${imgPath}" alt="" style="${isPerson ? 'border-radius:50%;width:36px;height:36px;object-fit:cover;' : ''}">`
        : `<div style="width:32px;height:48px;background:var(--bg4);border-radius:4px;flex-shrink:0;"></div>`;
      return `<div class="autocomplete-item" data-idx="${i}" onclick="acSelect(${i})">
        ${img}
        <div class="autocomplete-item-info">
          <div class="autocomplete-item-title">${title}</div>
          <div class="autocomplete-item-meta">${type}${year?' · '+year:''}</div>
        </div>
      </div>`;
    }).join('');
    list._items = items;
    list.style.display = 'block';
  } catch(e) { list.style.display = 'none'; }
}

function acSelect(idx) {
  const list = document.getElementById('acList');
  if (!list || !list._items) return;
  const item = list._items[idx];
  if (!item) return;
  list.style.display = 'none';
  const qEl = document.getElementById('q');
  if (qEl) qEl.value = item.title || item.name || '';
  if (item.media_type === 'person') item._isPerson = true;
  openDetail(item);
  window.scrollTo({top:0,behavior:'smooth'});
}

const navHistory = [];

function pushHistory(entry) {
  const last = navHistory[navHistory.length - 1];
  if (last && JSON.stringify(last) === JSON.stringify(entry)) return;
  navHistory.push(entry);
  document.getElementById('backBtn').style.display = navHistory.length > 1 ? 'inline-flex' : 'none';
}

function goBack() {
  navHistory.pop();
  const prev = navHistory[navHistory.length - 1];
  if (!prev) {
    const _bb2 = document.getElementById('backBtn'); if(_bb2){_bb2.style.display='none';};
    showHome(false);
    return;
  }
  navHistory.pop();
  if (prev.type === 'home') {
    showHome(false);
  } else if (prev.type === 'search') {
    document.getElementById('q').value = prev.query || '';
    search();
  } else if (prev.type === 'detail') {
    openDetail(prev.item);
  }
}

// ── FOCUSABLE SELECTOR ──────────────────────────
function getFocusables() {
  const sel = [
    '#homeBtn','#favsBtn','#historialBtn','#togglePanel','#tvModeBtn','#loginBtn',
    '.home-tab:not([style*="display:none"])',
    '.sort-btn:not([style*="display:none"])',
    '.surprise-btn',
    '.browse-card',
    '.trailer-btn:not([disabled])',
    '.fav-btn',
    '.season-card',
    '.ep-play-btn',
    '.ep-eye-btn',
    '.marathon-btn',
    '.rp-btn',
    '.platform-logo-btn',
    '#go','#q','#yearFilter',
    '.hist-profile-btn',
    '#scrollTopBtn',
    '.cat-card',
    '.cast-card',
  ].join(',');
  return [...document.querySelectorAll(sel)].filter(el => {
    if (!el.offsetParent && el.id !== 'scrollTopBtn') return false;
    const s = window.getComputedStyle(el);
    return s.display !== 'none' && s.visibility !== 'hidden' && s.opacity !== '0';
  });
}

function snFocus(el) {
  if (_snFocused && _snFocused !== el) {
    _snFocused.classList.remove('sn-focused');
    _snFocused.removeAttribute('tabindex');
  }
  _snFocused = el;
  el.classList.add('sn-focused', 'sn-focusable');
  el.setAttribute('tabindex', '0');
  el.focus({preventScroll: true});
  // Smooth scroll into view with margin
  const rect = el.getBoundingClientRect();
  const margin = 120;
  if (rect.top < margin) {
    window.scrollBy({top: rect.top - margin, behavior: 'smooth'});
  } else if (rect.bottom > window.innerHeight - margin) {
    window.scrollBy({top: rect.bottom - window.innerHeight + margin, behavior: 'smooth'});
  }
}

function snGetRect(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2, top: r.top, bottom: r.bottom, left: r.left, right: r.right, w: r.width, h: r.height };
}

function snNavigate(dir) {
  const focusables = getFocusables();
  if (!focusables.length) return;

  // Si nada enfocado, enfocar primer elemento
  if (!_snFocused || !document.contains(_snFocused)) {
    snFocus(focusables[0]);
    return;
  }

  const cur = snGetRect(_snFocused);
  let best = null;
  let bestScore = Infinity;

  focusables.forEach(el => {
    if (el === _snFocused) return;
    const r = snGetRect(el);
    let dx = r.x - cur.x;
    let dy = r.y - cur.y;

    let inDir = false;
    let primary = 0, secondary = 0;
    if (dir === 'right') { inDir = r.left >= cur.right - 10; primary = dx; secondary = Math.abs(dy); }
    if (dir === 'left')  { inDir = r.right <= cur.left + 10; primary = -dx; secondary = Math.abs(dy); }
    if (dir === 'down')  { inDir = r.top >= cur.bottom - 10; primary = dy; secondary = Math.abs(dx); }
    if (dir === 'up')    { inDir = r.bottom <= cur.top + 10; primary = -dy; secondary = Math.abs(dx); }

    if (!inDir || primary <= 0) return;

    // Score mejorado: penalizar más el desvío lateral para que en grillas
    // se mueva a la portada del mismo nivel y no salte a otra fila
    const overlap = (dir === 'left' || dir === 'right')
      ? Math.max(0, Math.min(cur.bottom, r.bottom) - Math.max(cur.top, r.top))   // overlap vertical
      : Math.max(0, Math.min(cur.right, r.right) - Math.max(cur.left, r.left));  // overlap horizontal
    const hasOverlap = overlap > 10;
    // Si hay overlap (misma fila/columna), priorizar fuertemente
    const score = primary + secondary * (hasOverlap ? 0.1 : 2.5);
    if (score < bestScore) { bestScore = score; best = el; }
  });

  if (best) snFocus(best);
}

function enableSpatialNav() {
  if (_snEnabled) return;
  _snEnabled = true;

  document.addEventListener('keydown', _snKeyHandler);
  // Focus first element
  setTimeout(() => {
    const focusables = getFocusables();
    if (focusables.length) snFocus(focusables[0]);
  }, 100);
}

function disableSpatialNav() {
  _snEnabled = false;
  document.removeEventListener('keydown', _snKeyHandler);
  if (_snFocused) {
    _snFocused.classList.remove('sn-focused','sn-focusable');
    _snFocused = null;
  }
}

function _snKeyHandler(e) {
  if (!_tvMode) return;

  // Mapear keyCodes de controles remotos de TV a teclas estándar
  // Samsung Tizen, LG webOS, Android TV, HbbTV todos usan códigos distintos
  const KC = e.keyCode || e.which || 0;
  let key = e.key;

  // Flechas (estándar + algunos TVs que mandan solo keyCode)
  if (KC === 37 || key === 'ArrowLeft')  key = 'ArrowLeft';
  if (KC === 38 || key === 'ArrowUp')    key = 'ArrowUp';
  if (KC === 39 || key === 'ArrowRight') key = 'ArrowRight';
  if (KC === 40 || key === 'ArrowDown')  key = 'ArrowDown';
  if (KC === 13 || key === 'Enter')      key = 'Enter';

  // Tecla Back / Return de controles remotos
  if (KC === 8   || key === 'Backspace')   key = 'Back';
  if (KC === 10009|| key === 'BrowserBack') key = 'Back'; // Samsung
  if (KC === 461  || key === 'GoBack')      key = 'Back'; // LG webOS
  if (KC === 27   || key === 'Escape')      key = 'Back'; // Escape como back

  // Don't intercept when typing in input
  if (document.activeElement?.tagName === 'INPUT' || document.activeElement?.tagName === 'TEXTAREA') {
    if (key === 'Back') { document.activeElement.blur(); snFocus(document.getElementById('go') || getFocusables()[0]); }
    return;
  }

  switch(key) {
    case 'ArrowRight': e.preventDefault(); snNavigate('right'); break;
    case 'ArrowLeft':  e.preventDefault(); snNavigate('left');  break;
    case 'ArrowDown':  e.preventDefault(); snNavigate('down');  break;
    case 'ArrowUp':    e.preventDefault(); snNavigate('up');    break;
    case 'Enter':
      e.preventDefault();
      if (_snFocused) {
        _snFocused.click();
        setTimeout(() => {
          const f = getFocusables();
          if (f.length && (!_snFocused || !document.contains(_snFocused))) snFocus(f[0]);
        }, 300);
      } else {
        // Nada enfocado — enfocar primer elemento
        const f = getFocusables();
        if (f.length) snFocus(f[0]);
      }
      break;
    case 'Back':
      e.preventDefault();
      const backBtn = document.getElementById('backBtn');
      if (backBtn && backBtn.style.display !== 'none') backBtn.click();
      else showHome();
      break;
  }
}

// Re-focus after page changes (container mutations)
const _snObserver = new MutationObserver(() => {
  if (!_tvMode || !_snEnabled) return;
  if (_snFocused && !document.contains(_snFocused)) {
    setTimeout(() => {
      const f = getFocusables();
      if (f.length) snFocus(f[0]);
    }, 200);
  }
});
_snObserver.observe(document.getElementById('container'), { childList: true, subtree: false });

function getTimeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 60) return `hace ${mins} min`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `hace ${hrs}h`;
  const days = Math.floor(hrs / 24);
  return `hace ${days} día${days > 1 ? 's' : ''}`;
}

async function checkVimeusNewContent() {
  const lastCheck = localStorage.getItem(NOTIF_LAST_CHECK);
  const now = Date.now();
  // Solo revisar cada 30 minutos
  if (lastCheck && now - parseInt(lastCheck) < 30 * 60 * 1000) {
    updateNotifBadge();
    return;
  }

  try {
    const headers = { 'X-API-Key': VIMEUS_API_KEY };
    const [moviesRes, seriesRes, animesRes] = await Promise.all([
      fetch('https://vimeus.com/api/listing/movies?page=1', { headers }).then(r => r.json()),
      fetch('https://vimeus.com/api/listing/series?page=1', { headers }).then(r => r.json()),
      fetch('https://vimeus.com/api/listing/animes?page=1', { headers }).then(r => r.json()),
    ]);

    const prevNotifs = getSavedNotifs();
    const prevIds = new Set(prevNotifs.map(n => `${n.type}_${n.tmdb_id}`));

    const newItems = [];

    (moviesRes?.data?.movies || []).slice(0, 10).forEach(m => {
      const key = `movie_${m.tmdb_id}`;
      if (!prevIds.has(key)) newItems.push({ id: key, tmdb_id: m.tmdb_id, title: m.title, poster: m.poster, type: 'movie', synced_at: m.synced_at });
    });
    (seriesRes?.data?.series || []).slice(0, 10).forEach(s => {
      const key = `series_${s.tmdb_id}`;
      if (!prevIds.has(key)) newItems.push({ id: key, tmdb_id: s.tmdb_id, title: s.title, poster: s.poster, type: 'series', synced_at: s.synced_at });
    });
    (animesRes?.data?.animes || []).slice(0, 10).forEach(a => {
      const key = `anime_${a.tmdb_id}`;
      if (!prevIds.has(key)) newItems.push({ id: key, tmdb_id: a.tmdb_id, title: a.title, poster: a.poster, type: 'anime', synced_at: a.synced_at });
    });

    if (newItems.length > 0 || prevNotifs.length === 0) {
      // Primera vez: guardar sin marcar como nuevo (no spamear)
      if (prevNotifs.length === 0) {
        const allItems = [
          ...(moviesRes?.data?.movies || []).slice(0, 5).map(m => ({ id: `movie_${m.tmdb_id}`, tmdb_id: m.tmdb_id, title: m.title, poster: m.poster, type: 'movie', synced_at: m.synced_at })),
          ...(seriesRes?.data?.series || []).slice(0, 5).map(s => ({ id: `series_${s.tmdb_id}`, tmdb_id: s.tmdb_id, title: s.title, poster: s.poster, type: 'series', synced_at: s.synced_at })),
          ...(animesRes?.data?.animes || []).slice(0, 5).map(a => ({ id: `anime_${a.tmdb_id}`, tmdb_id: a.tmdb_id, title: a.title, poster: a.poster, type: 'anime', synced_at: a.synced_at })),
        ];
        saveNotifs(allItems);
        saveSeenNotifs(allItems.map(n => n.id)); // marcar todos como vistos la primera vez
      } else {
        const updated = [...newItems, ...prevNotifs];
        saveNotifs(updated);
      }
    }

    localStorage.setItem(NOTIF_LAST_CHECK, String(now));
    updateNotifBadge();
  } catch(e) {
    console.warn('Notif check failed:', e);
  }
}

// Cerrar panel al hacer click fuera
document.addEventListener('click', (e) => {
  const panel = document.getElementById('notifPanel');
  const btn = document.getElementById('notifBtn');
  if (panel && panel.style.display !== 'none' && !panel.contains(e.target) && !btn.contains(e.target)) {
    panel.style.display = 'none';
  }
});

// ══ ALERTAS POR TÍTULO ═══════════════════════════════════
// ── BADGE NOVEDADES EN PORTADA ───────────────────────────
function hasNewBadge(tmdbId, mediaType) {
  // Verificar si este item está en las notificaciones no vistas
  const notifs = getSavedNotifs();
  const seen = getSeenNotifs();
  return notifs.some(n => 
    n.tmdb_id === tmdbId && 
    !seen.includes(n.id) &&
    (n.isAlert || n.type === (mediaType === 'tv' ? 'series' : 'movie'))
  );
}

function getAlerts() {
  try { return JSON.parse(localStorage.getItem('movara_alerts') || '[]'); } catch(e) { return []; }
}
function saveAlerts(arr) {
  localStorage.setItem('movara_alerts', JSON.stringify(arr));
}
function isAlerted(id, type) {
  return getAlerts().some(a => a.id === id && a.type === type);
}
function toggleAlert() {
  if (!currentDetailId) return;
  const alerts = getAlerts();
  const existing = alerts.findIndex(a => a.id === currentDetailId && a.type === currentDetailType);
  const btn = document.getElementById('alertBtn');
  const dot = document.getElementById('alertBtnDot');
  const icon = document.getElementById('alertBtnIcon');
  if (existing >= 0) {
    alerts.splice(existing, 1);
    saveAlerts(alerts);
    if (dot) dot.style.display = 'none';
    if (icon) { icon.setAttribute('fill','none'); icon.style.stroke = 'currentColor'; }
    showToast('🔕 Alerta desactivada');
  } else {
    alerts.push({
      id: currentDetailId,
      type: currentDetailType,
      title: currentDetailTitle,
      poster: currentDetailPoster,
      addedAt: new Date().toISOString()
    });
    saveAlerts(alerts);
    if (dot) dot.style.display = 'block';
    if (icon) { icon.setAttribute('fill','#facc15'); icon.style.stroke = '#facc15'; }
    showToast('🔔 Te avisaremos cuando haya novedades');
  }
}
function updateAlertBtn() {
  if (!currentDetailId) return;
  const active = isAlerted(currentDetailId, currentDetailType);
  const dot = document.getElementById('alertBtnDot');
  const icon = document.getElementById('alertBtnIcon');
  if (!dot || !icon) return;
  if (active) {
    dot.style.display = 'block';
    icon.setAttribute('fill','#facc15');
    icon.style.stroke = '#facc15';
  } else {
    dot.style.display = 'none';
    icon.setAttribute('fill','none');
    icon.style.stroke = 'currentColor';
  }
}

// Verificar alertas contra novedades de Vimeus
async function checkAlertsAgainstVimeus() {
  const alerts = getAlerts();
  if (!alerts.length) return;
  try {
    const headers = { 'X-API-Key': VIMEUS_API_KEY };
    const newNotifs = [];
    for (const alert of alerts) {
      const type = alert.type === 'tv' ? 'series' : alert.type === 'movie' ? 'movies' : 'animes';
      const res = await fetch(`https://vimeus.com/api/listing/episodes?tmdb_id=${alert.id}&page=1`, { headers }).then(r=>r.json());
      const episodes = res?.data?.episodes || [];
      if (!episodes.length) continue;
      // Verificar si hay episodios nuevos desde la última vez que se revisó esta alerta
      const lastKey = `movara_alert_last_${alert.id}`;
      const lastSynced = localStorage.getItem(lastKey) || '1970-01-01T00:00:00Z';
      const newEps = episodes.filter(e => e.synced_at > lastSynced);
      if (newEps.length > 0) {
        const latest = newEps[0];
        newNotifs.push({
          id: `alert_${alert.id}_s${latest.season}e${latest.episode}_${Date.now()}`,
          tmdb_id: alert.id,
          title: `${alert.title} — T${latest.season} E${latest.episode}`,
          poster: alert.poster,
          type: alert.type === 'tv' ? 'series' : alert.type,
          synced_at: latest.synced_at,
          isAlert: true
        });
        localStorage.setItem(lastKey, latest.synced_at);
      }
    }
    if (newNotifs.length > 0) {
      const prev = getSavedNotifs();
      saveNotifs([...newNotifs, ...prev]);
      updateNotifBadge();
    }
  } catch(e) { console.warn('Alert check failed:', e); }
}

// Notificación de prueba eliminada
async function handleUrlParams() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const type = params.get('type') || 'movie';
  const personId = params.get('person');
  if (id) {
    try {
      const r = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${TMDB_KEY}&language=es-ES`);
      const item = await r.json();
      item.media_type = type;
      if (type === 'tv') { item.title = item.name; item.release_date = item.first_air_date; }
      openDetail(item);
      return true;
    } catch(e) {}
  }
  if (personId) {
    try {
      const r = await fetch(`https://api.themoviedb.org/3/person/${personId}?api_key=${TMDB_KEY}&language=es-ES`);
      const item = await r.json();
      item._isPerson = true;
      openDetail(item);
      return true;
    } catch(e) {}
  }
  return false;
}

// Limpiar notificación de prueba si quedó guardada
(function cleanTestNotif() {
  const notifs = getSavedNotifs().filter(n => !n.isTest);
  if (notifs.length !== getSavedNotifs().length) {
    saveNotifs(notifs);
    saveSeenNotifs(getSeenNotifs().filter(id => !id.startsWith('test_')));
  }
})();

handleUrlParams().then(handled => {
  if (!handled) showHome();
  updateContinueBadge();
  checkVimeusNewContent();
  checkAlertsAgainstVimeus();
});
