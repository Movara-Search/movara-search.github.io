<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Movara</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #080809;
  --bg1:      #0f0f11;
  --bg2:      #141417;
  --bg3:      #1a1a1e;
  --bg4:      #202026;
  --border:   #222228;
  --border2:  #2c2c34;
  --accent:   #e8c547;
  --acc-dark: #c9a92e;
  --acc-lo:   rgba(232,197,71,.1);
  --acc-gl:   rgba(232,197,71,.25);
  --red:      #e84040;
  --red-lo:   rgba(232,64,64,.1);
  --green:    #22d47a;
  --grn-lo:   rgba(34,212,122,.1);
  --t1: #eeeef5;
  --t2: #8888a0;
  --t3: #44444f;
  --ease: cubic-bezier(.4,0,.2,1);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--t1);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  padding: 42px 20px 60px;
  display: flex;
  justify-content: center;
}


.wrap { width: 100%; max-width: 1600px; padding: 0 16px; box-sizing: border-box; }

/* ── HEADER ─────────────────────────── */
.site-header {
  text-align: center;
  margin-bottom: 28px;
}
.site-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px;
  letter-spacing: .06em;
  color: var(--t1);
  line-height: 1;
}
.site-title span { color: var(--accent); }
.site-sub {
  font-size: 12px;
  color: var(--t3);
  font-family: 'DM Mono', monospace;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-top: 4px;
}

/* ── SEARCH ROW ──────────────────────── */
.search-row {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  position: relative;
}

.search-ico {
  position: absolute;
  left: 16px; top: 50%;
  transform: translateY(-50%);
  color: var(--t3);
  pointer-events: none;
  font-size: 16px;
}

#q { flex:1; background:transparent; border:none; color:var(--t1); padding:0 18px; font-family:'DM Sans',sans-serif; font-size:15px; outline:none; height:100%; }
#q::placeholder { color:var(--t3); }

.search-btns { display: flex; gap: 8px; }

.btn-search {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 10px;
  padding: 14px 22px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all .14s var(--ease);
  letter-spacing: .02em;
}
.btn-search:hover { background: var(--acc-dark); box-shadow: 0 0 16px var(--acc-gl); }

/* Seasons badge */
.seasons-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 11px; font-family: 'DM Mono', monospace;
  color: var(--t2);
  margin-top: 6px;
}
.seasons-badge span { color: var(--accent); font-weight: 600; }

.btn-platforms {
  background: var(--bg2);
  color: var(--t2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 14px 16px;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .14s var(--ease);
  display: flex; align-items: center; gap: 7px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
}
.btn-platforms:hover { background: var(--bg3); color: var(--t1); border-color: var(--border2); }
.btn-platforms.active { background: var(--acc-lo); border-color: var(--accent); color: var(--accent); }

/* ── PLATFORMS PANEL ─────────────────── */
.platforms-panel {
  background: var(--bg1);
  border: 1px solid var(--border2);
  border-radius: 12px;
  margin-bottom: 20px;
  overflow: hidden;
  display: none;
  animation: fadeDown .18s var(--ease);
}
.platforms-panel.open { display: block; }

@keyframes fadeDown {
  from { opacity:0; transform:translateY(-6px); }
  to   { opacity:1; transform:translateY(0); }
}

.panel-head {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.panel-title {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .12em;
  color: var(--t2); font-family: 'DM Mono', monospace;
}

.panel-list {
  padding: 8px 10px;
  display: flex; flex-direction: column; gap: 3px;
  max-height: 280px; overflow-y: auto;
}
.panel-list::-webkit-scrollbar { width: 3px; }
.panel-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

.panel-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid transparent;
  transition: all .12s var(--ease);
}
.panel-item:hover { background: var(--bg2); border-color: var(--border); }
.panel-item img {
  width: 24px; height: 24px;
  border-radius: 5px; object-fit: contain;
  background: var(--bg3); padding: 2px; flex-shrink: 0;
}
.panel-item-name { flex: 1; font-size: 12px; font-weight: 500; color: var(--t2); }
.panel-item-domain { font-size: 10px; color: var(--t3); font-family: 'DM Mono', monospace; }

.del-btn {
  width: 24px; height: 24px;
  background: transparent; border: 1px solid transparent;
  border-radius: 6px; color: var(--t3);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 12px; transition: all .12s var(--ease); flex-shrink: 0;
}
.del-btn:hover { background: var(--red-lo); border-color: var(--red); color: var(--red); }

.panel-add {
  padding: 10px 10px 12px;
  border-top: 1px solid var(--border);
  display: flex; gap: 7px;
}
.add-input {
  flex: 1;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 7px;
  color: var(--t1);
  padding: 7px 11px;
  font-size: 11.5px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  transition: all .13s var(--ease);
}
.add-input::placeholder { color: var(--t3); font-size: 11px; }
.add-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--acc-lo); }

.add-btn {
  background: var(--acc-lo);
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 7px;
  padding: 7px 14px;
  font-size: 11.5px; font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: all .13s var(--ease);
  white-space: nowrap;
}
.add-btn:hover { background: var(--accent); color: #000; }

/* ── RESULT CARD ─────────────────────── */
.result-card {
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  animation: fadeDown .22s var(--ease);
}

/* Movie card with backdrop */
.movie-card {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 16px; overflow: hidden;
  animation: fadeDown .22s var(--ease);
  position: relative;
}
.movie-backdrop {
  position: absolute; top: 0; left: 0; right: 0; height: 600px; z-index: 0;
  background-size: cover; background-position: center 20%;
  transition: opacity .8s ease;
}
.movie-backdrop-fade {
  position: absolute; top: 0; left: 0; right: 0; height: 600px; z-index: 1;
  background: linear-gradient(to bottom, rgba(14,14,18,.15) 0%, rgba(14,14,18,.55) 50%, #141417 100%);
}
.movie-card > *:not(.movie-backdrop):not(.movie-backdrop-fade) { position: relative; z-index: 2; }

/* Movie info top */
.movie-top {
  display: flex;
  gap: 0;
  min-height: 560px;
}

.poster-col {
  flex-shrink: 0;
  width: 360px;
  position: relative;
  overflow: hidden;
  border-radius: 12px;
}
.poster-col img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.poster-overlay { display: none; }

.info-col {
  flex: 1;
  padding: 24px 24px 20px 20px;
  display: flex; flex-direction: column; gap: 10px;
}

.movie-meta {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.movie-year {
  font-size: 11px; font-family: 'DM Mono', monospace;
  color: var(--accent);
  background: rgba(0,0,0,.45);
  padding: 2px 8px; border-radius: 20px;
  border: 1px solid rgba(232,197,71,.35);
  cursor: pointer; transition: all .13s;
  backdrop-filter: blur(4px);
}
.movie-year:hover { background: var(--acc-gl); }
.genre-tag {
  font-size: 11px; font-family: 'DM Mono', monospace;
  color: rgba(255,255,255,.85); background: rgba(0,0,0,.45);
  padding: 2px 8px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,.2);
  cursor: pointer; transition: all .13s;
  backdrop-filter: blur(4px);
}
.genre-tag:hover { border-color: var(--accent); color: var(--t1); }
.movie-rating {
  font-size: 11px; font-family: 'DM Mono', monospace;
  color: rgba(255,255,255,.9);
  display: flex; align-items: center; gap: 4px;
  text-shadow: 0 1px 5px rgba(0,0,0,.8);
}
.movie-rating span { color: var(--accent); filter: drop-shadow(0 1px 3px rgba(0,0,0,.7)); }

.movie-title-big {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  letter-spacing: .04em;
  line-height: 1;
  color: #fff;
  text-shadow: 0 1px 8px rgba(0,0,0,.9), 0 2px 24px rgba(0,0,0,.7);
}

.movie-overview {
  font-size: 13px;
  color: rgba(255,255,255,.92);
  line-height: 1.6;
  flex: 1;
  text-shadow: 0 1px 6px rgba(0,0,0,.85);
}

.trailer-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--red);
  color: #fff; border: none;
  border-radius: 8px;
  padding: 10px 18px;
  font-size: 13px; font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: all .14s var(--ease);
  align-self: flex-start;
}
.trailer-btn:hover { background: #cc2020; box-shadow: 0 0 14px rgba(232,64,64,.3); }
.trailer-btn svg { flex-shrink: 0; }

.trailer-modal {
  display: none;
  position: fixed; inset: 0; z-index: 999;
  background: rgba(0,0,0,.92);
  align-items: center; justify-content: center;
  padding: 20px;
  animation: fadeBg .18s ease;
}
@keyframes fadeBg { from { opacity:0; } to { opacity:1; } }
.trailer-modal.open { display: flex; }
.trailer-modal-inner {
  width: 100%; max-width: 1560px;
  background: var(--bg1);
  border: 1px solid var(--border2);
  border-radius: 14px;
  overflow: hidden;
  animation: scaleIn .2s var(--ease);
}
@keyframes scaleIn { from { transform:scale(.95); opacity:0; } to { transform:scale(1); opacity:1; } }
.trailer-modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
}
.trailer-modal-head span { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--t3); letter-spacing: .1em; }
.modal-close {
  background: transparent; border: 1px solid var(--border2);
  border-radius: 6px; color: var(--t2);
  padding: 4px 12px; font-size: 11px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer; transition: all .12s var(--ease);
}
.modal-close:hover { background: var(--bg3); color: var(--t1); }
.trailer-modal iframe {
  width: 100%; height: 720px;
  border: none; display: block;
}

/* ── PLATFORMS SECTION ───────────────── */
.section-label {
  font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--t1); font-family: 'DM Sans', sans-serif;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::after {
  content: '';
  flex: 1; height: 1px; background: var(--border);
}

.justwatch-note {
  font-size: 10px; color: var(--t3);
  font-family: 'DM Mono', monospace;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 5px;
}
.jw-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.jw-dot.loading { background: var(--accent); animation: pulse .8s ease infinite alternate; }
.jw-dot.error   { background: var(--t3); }
@keyframes pulse { from { opacity:.3; } to { opacity:1; } }

.platform-grid {
  display: flex; flex-direction: column; gap: 6px;
}

/* ── RESULT PLATFORMS ───────────────── */
.streaming-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-radius: 10px;
  background: rgba(0,0,0,.4); backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,.1);
  margin-bottom: 8px; flex-wrap: wrap;
}
.streaming-banner-logo {
  height: 24px; width: auto; border-radius: 4px; object-fit: contain;
}
.streaming-banner-text {
  font-size: 12px; color: rgba(255,255,255,.8);
  font-family: 'DM Sans', sans-serif;
}
.streaming-banner-link {
  display: inline-flex; align-items: center; gap: 6px;
  background: #fff; color: #000; text-decoration: none;
  border-radius: 6px; padding: 4px 12px;
  font-size: 11px; font-weight: 700; font-family: 'DM Sans', sans-serif;
  transition: opacity .13s; margin-left: auto;
}
.streaming-banner-link:hover { opacity: .85; }
.result-platforms {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-top: 14px;
}
.rp-btn {
  display: flex; align-items: center; justify-content: center;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 7px 10px;
  cursor: pointer;
  transition: all .15s var(--ease);
  text-decoration: none;
}
.rp-btn:hover { background: var(--acc-lo); border-color: var(--accent); transform: translateY(-1px); }
.rp-btn img { width: 34px; height: 34px; border-radius: 9px; object-fit: cover; display: block; }
.rp-btn span { display: none; }

/* ── SEASONS ─────────────────────────── */
.seasons-section { padding: 16px; border-top: 1px solid var(--border); }
.ep-plat-btn {
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--t2);
  padding: 5px 14px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all .13s; display: flex; align-items: center; gap: 6px;
}
.ep-plat-btn:hover { border-color: var(--accent); color: var(--t1); }
.ep-plat-btn.active { background: var(--acc-lo); border-color: var(--accent); color: var(--accent); }
.cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px; margin-top: 4px;
}
.cat-card {
  border-radius: 12px; padding: 20px 14px;
  cursor: pointer; transition: all .15s;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  border: 1px solid rgba(255,255,255,.08);
  font-family: 'DM Sans', sans-serif;
}
.cat-card:hover { transform: translateY(-2px); filter: brightness(1.15); }
.cat-card-emoji { font-size: 28px; line-height: 1; }
.cat-card-name { font-size: 13px; font-weight: 700; color: #fff; text-align: center; }
.ep-play-btn {
  flex-shrink: 0; background: none; border: none; cursor: pointer;
  color: rgba(255,255,255,.7); padding: 2px 4px; border-radius: 4px;
  font-size: 13px; transition: all .13s; line-height: 1;
}
.ep-play-btn:hover { color: #fff; background: rgba(255,255,255,.1); }
.ep-play-btn.ready { color: var(--accent); }
.ep-visto-badge {
  font-size: 10px; background: #14532d; color: #86efac;
  border-radius: 6px; padding: 2px 7px;
  font-family: 'DM Mono', monospace; white-space: nowrap; flex-shrink: 0;
  margin-left: auto;
}
.hist-profile-btn:hover { border-color: var(--accent) !important; color: var(--accent) !important; }
.ep-eye-btn {
  flex-shrink: 0; background: none; border: none; cursor: pointer;
  color: rgba(255,255,255,.25); padding: 2px 4px; border-radius: 4px;
  font-size: 20px; transition: all .13s; line-height: 1; margin-left: auto;
}
.ep-eye-btn:hover { color: rgba(255,255,255,.6); }
.ep-eye-btn.watched { color: #22c55e; }

.seasons-grid {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px;
}

.season-card {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px 16px;
  cursor: pointer;
  transition: all .14s var(--ease);
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 500; color: var(--t2);
  font-family: 'DM Sans', sans-serif;
}
.season-card:hover { background: var(--bg4); border-color: var(--accent); color: var(--t1); }
.season-card.active { background: var(--acc-lo); border-color: var(--accent); color: var(--accent); }
.season-card .sc-num {
  font-family: 'DM Mono', monospace; font-size: 11px;
  background: var(--bg2); border-radius: 5px; padding: 1px 7px;
}
.season-card.active .sc-num { background: var(--accent); color: #000; }

.episodes-list {
  margin-top: 12px; display: none;
  flex-direction: column; gap: 4px;
  animation: fadeDown .18s var(--ease);
}
.episodes-list.open { display: flex; }

.episode-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 10px;
  background: var(--bg2); border-radius: 8px;
  border: 1px solid transparent;
  transition: all .12s var(--ease);
  cursor: default;
}
.episode-row:hover { background: var(--bg3); border-color: var(--border2); }
.ep-thumb {
  flex-shrink: 0; width: 100px; height: 56px;
  border-radius: 6px; object-fit: cover; background: var(--bg3);
  display: block;
}
.ep-thumb-placeholder {
  flex-shrink: 0; width: 100px; height: 56px;
  border-radius: 6px; background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: var(--t3);
}
.ep-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ep-num {
  font-size: 10px; font-family: 'DM Mono', monospace;
  color: var(--accent); background: var(--acc-lo);
  padding: 2px 7px; border-radius: 4px;
  flex-shrink: 0; min-width: 32px; text-align: center;
  align-self: flex-start; margin-top: 2px;
}
.ep-name { font-size: 12px; color: var(--t1); font-weight: 600; line-height: 1.3; }
.ep-meta { font-size: 10px; color: var(--t3); font-family: 'DM Mono', monospace; }
.ep-overview { font-size: 11px; color: var(--t2); line-height: 1.5; margin-top: 3px; }
.ep-name-legacy { font-size: 12px; color: var(--t2); flex: 1; }
.ep-loading { font-size: 11px; color: var(--t3); font-family: 'DM Mono', monospace; padding: 8px 0; }

/* ── BACK BUTTON ────────────────────── */
#backBtn {
  display: none; align-items: center; gap: 6px;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--t2);
  padding: 7px 14px; font-family: 'DM Sans', sans-serif;
  font-size: 12px; cursor: pointer;
  transition: all .14s var(--ease);
  margin-bottom: 12px;
}
#backBtn:hover { background: var(--bg4); color: var(--t1); border-color: var(--accent); }

/* ── CAST ────────────────────────────── */
.cast-section { padding: 16px; border-top: 1px solid var(--border); }
.cast-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.cast-card {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 12px; padding: 10px 14px;
  cursor: pointer; transition: all .14s var(--ease);
  max-width: 220px;
}
.cast-card:hover { background: var(--bg4); border-color: var(--accent); }
.cast-avatar {
  width: 64px; height: 64px; border-radius: 50%;
  object-fit: cover; flex-shrink: 0;
  background: var(--bg2);
}
.cast-initials {
  display: flex; align-items: center; justify-content: center;
  background: var(--bg3); border: 1px solid var(--border2);
  font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700;
  color: var(--t2);
}
.cast-info { min-width: 0; }
.cast-name { font-size: 12px; font-weight: 600; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cast-char { font-size: 10px; color: var(--t3); font-family: 'DM Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.person-filmography {
  margin-top: 12px; display: none;
  flex-direction: column; gap: 6px;
  animation: fadeDown .18s var(--ease);
}
.person-filmography.open { display: flex; }
.person-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; background: var(--bg2);
  border-radius: 10px; margin-bottom: 4px;
}
.person-header img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
.person-header-info .ph-name { font-size: 14px; font-weight: 700; color: var(--t1); }
.person-header-info .ph-known { font-size: 11px; color: var(--t3); font-family: 'DM Mono', monospace; }
.film-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; background: var(--bg2);
  border-radius: 10px; border: 1px solid transparent;
  cursor: pointer; transition: all .12s var(--ease);
}
.film-row:hover { background: var(--bg3); border-color: var(--border2); }
.film-poster { width: 54px; height: 80px; border-radius: 6px; object-fit: cover; background: var(--bg3); flex-shrink: 0; }
.film-info { flex: 1; min-width: 0; }
.film-title { font-size: 14px; color: var(--t1); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.film-year  { font-size: 11px; color: var(--t3); font-family: 'DM Mono', monospace; margin-top: 2px; }
.film-rating { font-size: 11px; color: var(--accent); font-family: 'DM Mono', monospace; flex-shrink: 0; }

/* ── RECOMMENDATIONS ─────────────────── */
.recs-section { padding: 16px; border-top: 1px solid var(--border); }
.recs-grid { margin-top: 2px; }

/* ── PERSON RESULT ───────────────────── */
.person-card {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 16px; overflow: hidden;
  animation: fadeDown .22s var(--ease);
}
.person-top {
  display: flex; gap: 0; align-items: stretch; min-height: 280px;
}
.person-photo-col {
  flex-shrink: 0; width: 190px; position: relative; overflow: hidden;
}
.person-photo {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.person-photo-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to right, transparent 70%, var(--bg2));
}
.person-details {
  flex: 1; padding: 24px 24px 20px 20px;
  display: flex; flex-direction: column; gap: 8px;
}
.person-name { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: .04em; color: var(--t1); line-height: 1; }
.person-meta { display: flex; flex-wrap: wrap; gap: 8px; }
.person-meta-tag {
  font-size: 11px; font-family: 'DM Mono', monospace;
  color: var(--t2); background: var(--bg3);
  border: 1px solid var(--border2); border-radius: 20px;
  padding: 2px 10px;
}
.person-bio { font-size: 13px; color: var(--t2); line-height: 1.6; }
.person-films-section { padding: 0 20px 20px; }
.person-films-label {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .14em; color: var(--t3); font-family: 'DM Mono', monospace;
  margin-bottom: 12px; margin-top: 16px;
  display: flex; align-items: center; gap: 8px;
}
.person-films-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* Film item in person view */
.pf-item {
  display: flex; gap: 14px; align-items: flex-start;
  padding: 14px 0; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: opacity .12s;
}
.pf-item:last-child { border-bottom: none; }
.pf-item:hover { opacity: .8; }
.pf-poster {
  width: 85px; height: 128px; border-radius: 8px;
  object-fit: cover; flex-shrink: 0; background: var(--bg3);
}
.pf-info { flex: 1; min-width: 0; padding-top: 2px; }
.pf-title { font-size: 17px; font-weight: 700; color: var(--t1); margin-bottom: 4px; font-family: 'DM Sans', sans-serif; }
.pf-meta { font-size: 11px; color: var(--t3); font-family: 'DM Mono', monospace; margin-bottom: 8px; }
.pf-overview { font-size: 13px; color: var(--t2); line-height: 1.55; }
.pf-seasons { font-size: 11px; color: var(--accent); font-family: 'DM Mono', monospace; margin-top: 6px; }

/* ── TRENDING / BROWSE ──────────────── */
.home-section { animation: fadeDown .22s var(--ease); }
.search-wrap { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.autocomplete-list {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 12px; overflow: hidden; z-index: 200;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
  animation: fadeDown .12s var(--ease);
}
.autocomplete-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; cursor: pointer; transition: background .1s;
}
.autocomplete-item:hover, .autocomplete-item.active { background: var(--bg4); }
.autocomplete-item img {
  width: 32px; height: 48px; object-fit: cover; border-radius: 4px; flex-shrink: 0;
}
.autocomplete-item-info { min-width: 0; }
.autocomplete-item-title { font-size: 13px; font-family: 'DM Sans',sans-serif; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.autocomplete-item-meta { font-size: 10px; color: var(--t3); font-family: 'DM Mono',monospace; margin-top: 1px; }
.tags-row {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  margin-top: 14px;
}
.tags-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .1em; color: var(--t2); font-family: 'DM Sans', monospace;
  white-space: nowrap;
}
.tag-chip {
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 20px; color: var(--t2);
  padding: 4px 12px; font-family: 'DM Sans', sans-serif; font-size: 12px;
  cursor: pointer; transition: all .13s; white-space: nowrap;
}
.tag-chip:hover { background: var(--acc-lo); border-color: var(--accent); color: var(--accent); }
.tag-chip.active { background: var(--acc-lo); border-color: var(--accent); color: var(--accent); }
.tag-platform:hover { border-color: var(--pc, var(--accent)); color: var(--pc, var(--accent)); background: rgba(0,0,0,.2); }
.platform-logo-btn {
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 14px; padding: 7px 10px;
  cursor: pointer; transition: all .15s;
  display: flex; align-items: center; justify-content: center;
}
.platform-logo-btn img {
  height: 34px; width: 34px;
  object-fit: cover; border-radius: 9px;
  display: block;
}
.platform-logo-btn:hover {
  border-color: var(--accent); background: var(--acc-lo);
  transform: translateY(-1px);
}
.home-controls {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px; flex-wrap: wrap;
}
.home-tab {
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--t2); padding: 7px 16px;
  font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all .13s var(--ease);
}
.home-tab.active { background: var(--acc-lo); border-color: var(--accent); color: var(--accent); }
.home-tab:hover:not(.active) { background: var(--bg4); color: var(--t1); }
.sort-btn {
  margin-left: auto;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--t2); padding: 7px 14px;
  font-family: 'DM Mono', monospace; font-size: 11px;
  cursor: pointer; transition: all .13s var(--ease);
  display: flex; align-items: center; gap: 6px;
}
.sort-btn:hover { background: var(--bg4); color: var(--t1); }
.sort-btn.active { border-color: var(--accent); color: var(--accent); }

.browse-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 14px;
}
.browse-card {
  cursor: pointer; border-radius: 10px;
  overflow: hidden; border: 1px solid var(--border2);
  background: var(--bg3); transition: all .14s var(--ease);
  position: relative; text-decoration: none; display: block; color: inherit;
}
.browse-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.browse-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
.browse-card-body { padding: 7px 8px 9px; }
.browse-card-title { font-size: 11px; font-weight: 600; color: var(--t1); line-height: 1.3; margin-bottom: 3px; }
.browse-card-year {
  display: inline-block; font-size: 9px; font-family: 'DM Mono', monospace;
  color: #000; background: var(--accent);
  border-radius: 20px; padding: 1px 7px;
}
/* Hover tooltip */
.browse-card-tooltip {
  position: absolute; inset: 0;
  background: rgba(14,14,18,.92);
  display: flex; flex-direction: column; justify-content: center;
  padding: 12px; opacity: 0; transition: opacity .16s;
  gap: 6px;
}
.browse-card:hover .browse-card-tooltip { opacity: 1; }
.bct-title { font-size: 12px; font-weight: 700; color: var(--t1); line-height: 1.3; }
.bct-meta { font-size: 10px; color: var(--accent); font-family: 'DM Mono', monospace; }
.bct-overview { font-size: 10px; color: var(--t2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }

/* ── SEARCH RESULTS ─────────────────── */
.search-results-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 18px; flex-wrap: wrap;
}
.search-results-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 22px;
  letter-spacing: .04em; color: var(--t1); flex: 1;
}
.search-results-title span { color: var(--accent); }
.search-type-tabs { display: flex; gap: 6px; }

/* ── FAVORITES ──────────────────────── */
.fav-btn {
  background: none; border: none; cursor: pointer;
  padding: 4px 6px; border-radius: 8px;
  transition: all .15s; line-height: 1;
  display: inline-flex; align-items: center;
}
.fav-btn:hover { background: rgba(255,255,255,.08); }
.fav-btn svg { transition: all .2s; }
.fav-btn.active svg { fill: #f5c518; stroke: #f5c518; }
.fav-btn:not(.active) svg { fill: none; stroke: rgba(255,255,255,.6); }

/* ── BROWSE BY TAG ───────────────────── */
.tag-browse-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px; flex-wrap: wrap;
}
.tag-browse-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: .04em; color: var(--t1); flex: 1; }

/* ── LOADING / ERROR ─────────────────── */
.state-msg {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 40px;
  color: var(--t3); font-size: 13px;
}
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 640px) {
  /* Body padding */
  body { padding: 16px 10px 40px; }

  /* Browse grid - 3 columns on mobile */
  .browse-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .browse-card-body { padding: 4px 5px 6px; }
  .browse-card-title { font-size: 9px; }
  .browse-card-year { font-size: 8px; padding: 1px 5px; }

  /* Movie card */
  .movie-top { flex-direction: column; }
  .poster-col { width: 100%; height: 220px; border-radius: 0; }
  .poster-overlay { background: linear-gradient(to bottom, transparent 60%, var(--bg2)); }
  .info-col { padding: 16px 14px 14px; }
  .movie-title-big { font-size: 26px; }
  .movie-overview { font-size: 12px; }

  /* Person card */
  .person-top { flex-direction: column; min-height: unset; }
  .person-photo-col { width: 100%; height: 240px; }
  .person-photo-overlay { background: linear-gradient(to bottom, transparent 60%, var(--bg2)); }
  .person-details { padding: 14px; }
  .person-name { font-size: 26px; }

  /* Person filmography tabs */
  .pf-poster { width: 64px; height: 96px; }
  .pf-title { font-size: 13px; }

  /* Tags wrap */
  .movie-meta { gap: 5px; }
  .movie-year, .genre-tag { font-size: 10px; padding: 2px 6px; }

  /* Home controls */
  .home-controls { gap: 6px; }
  .home-tab { padding: 6px 10px; font-size: 11px; }
  .sort-btn { padding: 6px 10px; font-size: 10px; }

  .tags-row { gap: 5px; margin-top: 10px; }
  .tag-chip { font-size: 11px; padding: 3px 9px; }
  /* Nav buttons */
  #homeBtn, #favsBtn { padding: 8px 12px; font-size: 12px; }

  /* Search row */
  .search-btns { gap: 6px; }
  .btn-search { padding: 0 14px; font-size: 13px; }

  /* Cast grid - 4 per row */
  .cast-grid { grid-template-columns: repeat(4, 1fr) !important; gap: 8px; }
  .cast-avatar { width: 52px; height: 52px; }
  .cast-name { font-size: 9px; }
  .cast-char { font-size: 8px; }

  /* Platforms */
  .streaming-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-radius: 10px;
  background: rgba(0,0,0,.4); backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,.1);
  margin-bottom: 8px; flex-wrap: wrap;
}
.streaming-banner-logo {
  height: 24px; width: auto; border-radius: 4px; object-fit: contain;
}
.streaming-banner-text {
  font-size: 12px; color: rgba(255,255,255,.8);
  font-family: 'DM Sans', sans-serif;
}
.streaming-banner-link {
  display: inline-flex; align-items: center; gap: 6px;
  background: #fff; color: #000; text-decoration: none;
  border-radius: 6px; padding: 4px 12px;
  font-size: 11px; font-weight: 700; font-family: 'DM Sans', sans-serif;
  transition: opacity .13s; margin-left: auto;
}
.streaming-banner-link:hover { opacity: .85; }
.result-platforms { gap: 5px; }
  .rp-btn { padding: 5px 8px; font-size: 10px; gap: 4px; }
  .rp-btn img { width: 14px; height: 14px; }

  /* Buttons row */
  .trailer-btn { padding: 8px 12px; font-size: 12px; }

  .cat-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cat-card { padding: 14px 8px; }
  .cat-card-emoji { font-size: 22px; }
  .cat-card-name { font-size: 11px; }
  /* Episode rows on mobile */
  .ep-thumb { width: 72px; height: 40px; }
  .ep-thumb-placeholder { width: 72px; height: 40px; font-size: 14px; }
  .ep-overview { display: block; font-size: 10px; }

  /* Trailer embed */
  .trailer-embed iframe { height: 200px; }
  .trailer-modal iframe { height: 200px; }

  /* Sections */
  .section-label { font-size: 8px; }

  /* Tooltip hidden on mobile (touch devices) */
  .browse-card-tooltip { display: none; }

  /* Autocomplete */
  .autocomplete-item img { width: 28px; height: 42px; }
  .autocomplete-item-title { font-size: 12px; }
  .autocomplete-item { padding: 7px 10px; gap: 8px; }

  /* Platform logo buttons */
  .platform-logo-btn img { height: 28px; width: 28px; }
  .platform-logo-btn { padding: 5px 7px; border-radius: 10px; }
  .tags-row { gap: 6px; flex-wrap: wrap; }

  /* Section labels */
  .section-label { font-size: 11px; }

  /* Surprise btn */
  .surprise-btn span { display: none; }
  .surprise-btn { padding: 7px 10px; }
}

@media (max-width: 400px) {
  .browse-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .cast-grid { grid-template-columns: repeat(3, 1fr) !important; }
}

/* ── TV MODE ─────────────────────────────── */
body.tv-mode {
  zoom: 1.35;
}
body.tv-mode #trailerModal {
  zoom: 1;
}
body.tv-mode #tvModeBtn {
  background: var(--acc-lo) !important;
  border-color: var(--accent) !important;
  color: var(--accent) !important;
}

/* Spatial nav focus ring - TV mode only */
body.tv-mode .sn-focusable:focus,
body.tv-mode .sn-focusable.sn-focused {
  outline: 3px solid var(--accent) !important;
  outline-offset: 2px !important;
  box-shadow: 0 0 0 4px rgba(232,197,71,0.25) !important;
  border-color: var(--accent) !important;
}
body.tv-mode .browse-card.sn-focused {
  transform: translateY(-4px) scale(1.04) !important;
  border-color: var(--accent) !important;
  box-shadow: 0 8px 32px rgba(232,197,71,0.3) !important;
  z-index: 10;
  position: relative;
}
body.tv-mode button.sn-focused,
body.tv-mode .home-tab.sn-focused,
body.tv-mode .trailer-btn.sn-focused {
  background: var(--acc-lo) !important;
  border-color: var(--accent) !important;
  color: var(--accent) !important;
}

@media (min-width: 1400px) {
  /* Large screen / TV mode */
  body { padding: 32px 48px 60px; }

  /* Nav buttons */
  #homeBtn, #favsBtn, #historialBtn, #togglePanel, #loginBtn {
    padding: 14px 26px !important;
    font-size: 16px !important;
    border-radius: 12px !important;
  }
  #loginBtn span { font-size: 16px !important; }

  /* Search bar */
  #q { font-size: 18px !important; padding: 18px 20px 18px 52px !important; border-radius: 14px !important; }
  #yearFilter { font-size: 16px !important; padding: 18px 14px !important; width: 90px !important; border-radius: 12px !important; }
  .btn-search { font-size: 16px !important; padding: 0 28px !important; border-radius: 12px !important; }
  .search-ico { font-size: 20px !important; left: 18px !important; }

  /* Nav logo */
  .nav-logo { font-size: 28px !important; }
  .nav-tagline { font-size: 14px !important; }

  /* Tabs */
  .home-tab { padding: 10px 20px !important; font-size: 15px !important; border-radius: 10px !important; }
  .sort-btn { padding: 10px 20px !important; font-size: 13px !important; }
  .surprise-btn { padding: 14px 30px !important; font-size: 15px !important; }

  /* Browse grid - more columns, bigger cards */
  .browse-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)) !important; gap: 16px !important; }
  .browse-card-title { font-size: 13px !important; }
  .browse-card-year { font-size: 10px !important; }

  /* Detail card */
  .movie-title-big { font-size: 42px !important; }
  .movie-overview { font-size: 16px !important; }
  .trailer-btn { padding: 13px 22px !important; font-size: 15px !important; border-radius: 11px !important; }
  .genre-tag, .movie-year { font-size: 13px !important; padding: 5px 12px !important; }

  /* Episode rows */
  .ep-name { font-size: 15px !important; }
  .ep-num { font-size: 14px !important; }
  .ep-meta { font-size: 12px !important; }
  .ep-overview { font-size: 13px !important; }
  .ep-thumb { width: 140px !important; height: 79px !important; }
  .ep-play-btn { font-size: 18px !important; }

  /* Season cards */
  .season-card { font-size: 16px !important; padding: 12px 16px !important; }
  .sc-num { font-size: 18px !important; width: 34px !important; height: 34px !important; }

  /* Section labels */
  .section-label { font-size: 16px !important; }

  /* Platform logos */
  .platform-logo-btn img { height: 44px !important; width: 44px !important; }
  .platform-logo-btn { padding: 8px 10px !important; border-radius: 14px !important; }

  /* Cast grid */
  .cast-avatar { width: 72px !important; height: 72px !important; }
  .cast-name { font-size: 13px !important; }

  /* Scroll to top btn */
  #scrollTopBtn { width: 56px !important; height: 56px !important; font-size: 26px !important; }
}

/* ── NUEVA BÚSQUEDA INTEGRADA ───────── */
.search-row-new {
  display: flex; align-items: center;
  background: var(--bg2); border: 1.5px solid var(--border2);
  border-radius: 24px; overflow: hidden;
  margin-bottom: 20px; height: 46px;
  transition: border-color .15s, box-shadow .15s;
}
.search-row-new:focus-within {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--acc-lo);
}
.search-row-new input#q {
  flex: 1; background: transparent; border: none;
  color: var(--t1); padding: 0 18px;
  font-family: 'DM Sans', sans-serif; font-size: 15px;
  outline: none; height: 100%;
}
.search-row-new input#q::placeholder { color: var(--t3); }
.search-row-new .s-divider {
  width: 1px; height: 20px; background: var(--border2); flex-shrink: 0;
}
.search-row-new input#yearFilter {
  background: transparent; border: none;
  color: var(--t2); padding: 0 12px;
  font-family: 'DM Sans', sans-serif; font-size: 14px;
  outline: none; width: 72px; height: 100%;
  -moz-appearance: textfield;
}
.search-row-new input#yearFilter::placeholder { color: var(--t3); }
.search-row-new input#yearFilter::-webkit-inner-spin-button,
.search-row-new input#yearFilter::-webkit-outer-spin-button { -webkit-appearance: none; }
.search-row-new button#go {
  background: none; border: none; color: var(--t2);
  padding: 0 16px; cursor: pointer; height: 100%;
  display: flex; align-items: center;
  transition: color .13s; flex-shrink: 0;
}
.search-row-new button#go:hover { color: var(--accent); }
/* ── BADGE NOVEDAD EN PORTADA ─────────────────── */
.browse-card { position: relative; }
.card-new-badge {
  position: absolute; top: 7px; right: 7px;
  width: 12px; height: 12px; border-radius: 50%;
  background: #e50914; border: 2px solid var(--bg);
  z-index: 10; animation: pulseBadge 2s infinite;
}
@keyframes pulseBadge {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.25); opacity: .8; }
}

/* ── TOOLTIPS CUSTOM ─────────────────────────────── */
.tip {
  position: relative;
}
.tip::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  background: var(--bg4);
  color: var(--t1);
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
  padding: 5px 10px;
  border-radius: 7px;
  border: 1px solid var(--border2);

const TMDB_KEY = "68665a6217ad91b1d16292b0fff543dc";
const TMDB_IMG = "https://image.tmdb.org/t/p/w500";
let currentMediaType = 'movie'; // updated on each search
const COUNTRY  = "AR";

const DEFAULT_PLATFORMS = [
  { name:"Netflix",      domain:"netflix.com",       url:"https://www.netflix.com/search?q={q}",                      unofficial:false },
  { name:"Prime Video",  domain:"primevideo.com",    url:"https://www.primevideo.com/search/ref=atv_nb_sr?phrase={q}", unofficial:false },

  { name:"SeriesFlixHD", domain:"seriesflixhd.shop", url:"https://seriesflixhd.shop/?s={q}",                          unofficial:true  },
  { name:"HDFull",       domain:"hdfull.org",        url:"https://hdfull.org/{type}/{slug}",                          unofficial:true, noEmbed:true },
  { name:"PelisPedia",   domain:"pelispedia.mov",    url:"https://pelispedia.mov/search?s={q_es}",                    unofficial:true, noEmbed:true },

};

// ═══════════════════════════════════════════════

const REMOVED_DOMAINS = new Set(['cuevana.is','cuevana3.io','pelismas.net','pelisflix1.wiki','gnula.nu']);
const PLATFORMS_VERSION = 10;
function loadPlatforms() {
  try {
    const ver = parseInt(localStorage.getItem('platforms_version') || '0');
    if (ver < PLATFORMS_VERSION) {
      // Version bump: wipe saved and use fresh defaults
      localStorage.removeItem('platforms_v2');
      localStorage.setItem('platforms_version', String(PLATFORMS_VERSION));
      return JSON.parse(JSON.stringify(DEFAULT_PLATFORMS));
    }
    const saved = localStorage.getItem('platforms_v2');
    if (saved) {
      let list = JSON.parse(saved).filter(p => !REMOVED_DOMAINS.has(p.domain));
      const domains = new Set(list.map(p => p.domain));
      DEFAULT_PLATFORMS.forEach(p => { if (!domains.has(p.domain)) list.push(p); });
      savePlatforms(list);
      return list;
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_PLATFORMS));
}
function savePlatforms(list) {
  localStorage.setItem('platforms_v2', JSON.stringify(list));
}
let platforms = loadPlatforms();

// ═══════════════════════════════════════════════

function renderPanel() {
  const list = document.getElementById('panelList');
  list.innerHTML = '';
  platforms.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'panel-item';
    row.innerHTML = `

        </svg>
      </button>`;
    list.appendChild(row);
  });

  list.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.i);
      platforms.splice(i, 1);
      savePlatforms(platforms);

}

document.getElementById('addBtn').addEventListener('click', () => {

});

document.getElementById('togglePanel').addEventListener('click', () => {

// ═══════════════════════════════════════════════
// TMDB
// ═══════════════════════════════════════════════
async function tmdbSearch(title) {
  // search/multi returns both movies and TV shows
  const r = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&language=es-ES&query=${encodeURIComponent(title)}&include_adult=false&page=1`);
  const d = await r.json();
  // Pick first movie or tv result (skip people)
  const result = d.results?.find(r => r.media_type === 'movie' || r.media_type === 'tv') || null;
  if (!result) return null;
  // Normalize TV fields
  if (result.media_type === 'tv') {
    result.title = result.name || result.original_name;
    result.release_date = result.first_air_date;
  }
  return result;
}

async function tmdbSeriesDetails(id) {
  const r = await fetch(`https://api.themoviedb.org/3/tv/${id}?api_key=${TMDB_KEY}&language=es-ES`);
  const d = await r.json();
  return d;
}

const YT_KEY = "AIzaSyARvaC7_0Q4ROKS15_WeaEQkD8MZWVNolQ";

async function searchYouTube(query) {
  try {
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=1&key=${YT_KEY}`;
    const r = await fetch(url);
    if (!r.ok) return null;
    const d = await r.json();
    return d.items?.[0]?.id?.videoId || null;
  } catch(e) {
    return null;
  }
}

async function tmdbVideos(id, movieTitle) {
  const keys = [];

  // 1. YouTube: trailer en español latino
  const latinoKey = await searchYouTube(`${movieTitle} trailer español latino`);
  if (latinoKey) keys.push(latinoKey);

  // 2. TMDB Spanish trailers
  try {
    const type = currentMediaType;
    const d = await fetch(`https://api.themoviedb.org/3/${type}/${id}/videos?api_key=${TMDB_KEY}&language=es`).then(r=>r.json());
    (d.results||[]).filter(v=>v.site==='YouTube'&&v.type==='Trailer').forEach(v=>{ if(!keys.includes(v.key)) keys.push(v.key); });
  } catch(e){}

  // 3. YouTube: trailer en inglés
  const enKey = await searchYouTube(`${movieTitle} official trailer`);
  if (enKey && !keys.includes(enKey)) keys.push(enKey);

  // 4. TMDB English trailers + teasers
  try {
    const type = currentMediaType;
    const d2 = await fetch(`https://api.themoviedb.org/3/${type}/${id}/videos?api_key=${TMDB_KEY}&language=en-US`).then(r=>r.json());
    (d2.results||[]).filter(v=>v.site==='YouTube').sort((a,b)=>a.type==='Trailer'?-1:1).forEach(v=>{ if(!keys.includes(v.key)) keys.push(v.key); });
  } catch(e){}

  // Guardar lista para fallback
  window._trailerKeys = keys;
  window._trailerKeyIdx = 0;
  return keys[0] || null;
}

async function loadTrailer(movieId, movieTitle, backdropPath) {
  const key = await tmdbVideos(movieId, movieTitle);
  const btn = document.getElementById('trailerBtn');
  const txt = document.getElementById('trailerBtnText');
  if (!btn) return;
  if (key) {
    currentTrailerKey = key;
    btn.disabled = false;
    txt.textContent = 'Ver tráiler';
    btn.addEventListener('click', () => window.open(`https://www.youtube.com/watch?v=${currentTrailerKey}`, '_blank'));

    // Background video con fallback automático si el video está bloqueado
    const bdEl = document.getElementById('movieBackdrop');
    if (bdEl && backdropPath) {
      bdEl.style.backgroundImage = `url('https://image.tmdb.org/t/p/w1280${backdropPath}')`;
      bdEl.style.overflow = 'hidden';
      const iframeEl = document.createElement('iframe');
      iframeEl.id = 'trailerBgIframe';
      iframeEl.referrerPolicy = 'strict-origin-when-cross-origin';
      iframeEl.allow = 'autoplay; encrypted-media';
      iframeEl.style.cssText = 'position:absolute;top:50%;left:60%;width:200%;height:200%;transform:translate(-50%,-50%);border:none;pointer-events:none;opacity:0;transition:opacity 1.8s ease;';
      bdEl.appendChild(iframeEl);

      function setBgKey(k) {
        iframeEl.src = `https://www.youtube-nocookie.com/embed/${k}?autoplay=1&mute=1&controls=0&loop=1&playlist=${k}&modestbranding=1&rel=0&playsinline=1&enablejsapi=1`;
        currentTrailerKey = k;

        // Si en 5 segundos el video no arrancó (bloqueado por país/propietario), probar el siguiente
        clearTimeout(iframeEl._blockTimer);
        iframeEl._blockTimer = setTimeout(() => {
          // Intentar detectar si el iframe muestra error revisando si podemos comunicarnos con él
          // Si el video estuviera reproduciendo, habría mandado mensajes; si no mandó nada, está bloqueado
          const keys = window._trailerKeys || [];
          const idx = window._trailerKeyIdx || 0;
          if (idx + 1 < keys.length) {
            window._trailerKeyIdx = idx + 1;
            setBgKey(keys[window._trailerKeyIdx]);
          }
        }, 2000);
      }

      // Cuando el video SÍ reproduce, cancela el timer
      window.addEventListener('message', (e) => {
        if (!e.data) return;
        let data = e.data;
        if (typeof data === 'string') { try { data = JSON.parse(data); } catch(err) { return; } }
        if (data.event === 'onStateChange' && data.info === 1) {
          // Estado 1 = reproduciendo → cancelar timer, funciona bien
          clearTimeout(iframeEl._blockTimer);
        }
      });
      setBgKey(key);

      // Escuchar mensajes de YouTube para detectar video bloqueado
      const _msgHandler = (e) => {
        if (!e.data) return;
        let data = e.data;
        if (typeof data === 'string') { try { data = JSON.parse(data); } catch(err) { return; } }
        // Error 150 = bloqueado por el propietario, 101 = bloqueado por país
        if (data.event === 'onError' && (data.info === 150 || data.info === 101 || data.info === 100)) {
          const keys = window._trailerKeys || [];
          window._trailerKeyIdx = (window._trailerKeyIdx || 0) + 1;
          if (window._trailerKeyIdx < keys.length) {
            setBgKey(keys[window._trailerKeyIdx]);
          } else {
            window.removeEventListener('message', _msgHandler);
          }
        }
      };
      window.addEventListener('message', _msgHandler);

      setTimeout(() => { const el = document.getElementById('trailerBgIframe'); if (el) el.style.opacity = '1'; }, 1500);
    }
    const eyeBtn = document.getElementById('trailerBgBtn');
    if (eyeBtn) eyeBtn.style.display = 'flex';
  } else {
    txt.textContent = 'Tráiler no disponible';
    btn.style.opacity = '.4';
    btn.style.cursor = 'default';
  }
}

let currentTvId = null;

async function loadSeasons(tvId, totalSeasons, histMode) {
  currentTvId = tvId;
  activeSeason = null;
  const grid = document.getElementById('seasonsGrid');
  const epList = document.getElementById('episodesList');
  if (!grid) return;
  grid.innerHTML = '';
  epList.innerHTML = '';
  epList.classList.remove('open');
  if (!histMode) renderEpPlatformSelector();
  else { const sel = document.getElementById('epPlatformSelector'); if(sel) sel.style.display='none'; }

  // Preload episode counts for ALL modes to show progress bars
  const seasonEpCounts = {};
  await Promise.all(Array.from({length: totalSeasons}, (_, i) => i+1).map(async s => {
    try {
      const r = await fetch(`https://api.themoviedb.org/3/tv/${tvId}/season/${s}?api_key=${TMDB_KEY}&language=es-ES`);
      const d = await r.json();
      seasonEpCounts[s] = (d.episodes||[]).length;
    } catch(e) { seasonEpCounts[s] = 0; }
  }));

  const watched = getWatched();

  for (let s = 1; s <= totalSeasons; s++) {
    const card = document.createElement('div');
    card.className = 'season-card';
    card.dataset.season = s;
    card.style.position = 'relative';
    card.style.overflow = 'hidden';

    const total = seasonEpCounts[s] || 0;
    const seen = total > 0 ? watched.filter(e => e.startsWith(s + 'x')).length : 0;
    const pct = total > 0 ? Math.round((seen / total) * 100) : 0;

    // Progress bar background for all modes
    if (pct > 0) {
      const bar = document.createElement('div');
      bar.id = `seasonBar_${s}`;
      bar.style.cssText = `position:absolute;inset:0;width:${pct}%;background:rgba(232,197,71,0.18);pointer-events:none;z-index:0;transition:width .4s;`;
      card.appendChild(bar);
    }

    const pctLabel = pct > 0 ? `<span style="margin-left:auto;font-size:10px;color:var(--accent);font-family:'DM Mono',monospace;position:relative;z-index:1;">${pct}%</span>` : '';
    const marathonBtn = histMode ? '' : `<button class="marathon-btn" title="Maratón: marcar toda la temporada como vista"
        style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:13px;padding:2px 4px;opacity:.6;transition:opacity .13s;"
        onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.6">⚡</button>`;

    card.innerHTML += `<span class="sc-num" style="position:relative;z-index:1;">${s}</span>
      <span style="position:relative;z-index:1;">Temporada ${s}</span>
      ${pct > 0 ? pctLabel : (histMode ? '' : marathonBtn)}
      ${pct > 0 && !histMode ? marathonBtn : ''}`;

    card.addEventListener('click', (e) => {
      if (!histMode && e.target.closest('.marathon-btn')) { e.stopPropagation(); marathonSeason(tvId, s); return; }
      toggleSeason(tvId, s, card, histMode);
    });
    grid.appendChild(card);
  }
}

async function marathonSeason(tvId, seasonNum) {
  try {
    const r = await fetch(`https://api.themoviedb.org/3/tv/${tvId}/season/${seasonNum}?api_key=${TMDB_KEY}&language=es-ES`);
    const d = await r.json();
    const episodes = d.episodes || [];
    if (!episodes.length) return;
    const key = getWatchedKey();
    let watched = getWatched();
    const allWatched = episodes.every(ep => watched.includes(`${seasonNum}x${ep.episode_number}`));

    if (allWatched) {
      // Toggle OFF: unmark all episodes
      for (const ep of episodes) {
        const epId = `${seasonNum}x${ep.episode_number}`;
        const idx = watched.indexOf(epId);
        if (idx >= 0) watched.splice(idx, 1);
      }
      document.querySelectorAll('.ep-eye-btn').forEach(btn => {
        const epNum = btn.closest('.episode-row')?.querySelector('.ep-num')?.textContent;
        if (epNum && !watched.includes(`${seasonNum}x${epNum}`)) {
          btn.classList.remove('watched'); btn.title = 'Marcar como visto';
        }
      });
      localStorage.setItem(key, JSON.stringify(watched));
      if (window._fbUser && window._fbDb && window._fbDoc && window._fbSetDoc) {
        if (!window._watchedCache) window._watchedCache = {};
        window._watchedCache[key] = watched;
        const ref = window._fbDoc(window._fbDb, 'watched', window._fbUser.uid);
        await window._fbSetDoc(ref, { data: window._watchedCache }, { merge: true });
      }
      showToast(`↩ Temporada ${seasonNum} desmarcada`);
      return;
    }

    // Toggle ON: mark all
    let added = 0;
    for (const ep of episodes) {
      const epId = `${seasonNum}x${ep.episode_number}`;
      if (!watched.includes(epId)) { watched.push(epId); added++; }
    }
    localStorage.setItem(key, JSON.stringify(watched));
    document.querySelectorAll('.ep-eye-btn').forEach(btn => {
      const epNum = btn.closest('.episode-row')?.querySelector('.ep-num')?.textContent;
      if (epNum && watched.includes(`${seasonNum}x${epNum}`)) {
        btn.classList.add('watched'); btn.title = 'Marcar como no visto';
      }
    });
    if (window._fbUser && window._fbDb && window._fbDoc && window._fbSetDoc) {
      if (!window._watchedCache) window._watchedCache = {};
      window._watchedCache[key] = watched;
      const ref = window._fbDoc(window._fbDb, 'watched', window._fbUser.uid);
      await window._fbSetDoc(ref, { data: window._watchedCache }, { merge: true });
    }
    for (const ep of episodes) {
      await addToHistorial({
        id: currentDetailId, title: currentDetailTitle,
        poster: currentDetailPoster, type: 'tv',
        year: currentDetailYear, season: seasonNum, episode: ep.episode_number,
        epName: ep.name || '',
        date: new Date().toISOString()
      });
    }
    showToast(`⚡ Temporada ${seasonNum} marcada como vista (${added} episodios)`);
  } catch(e) { console.error('Marathon error:', e); }
}

async function toggleSeason(tvId, seasonNum, clickedCard, histMode) {
  const epList = document.getElementById('episodesList');
  if (activeSeason === seasonNum) {
    activeSeason = null;
    clickedCard.classList.remove('active');
    epList.classList.remove('open');
    epList.innerHTML = '';
    return;
  }
  document.querySelectorAll('.season-card').forEach(c => c.classList.remove('active'));
  clickedCard.classList.add('active');
  activeSeason = seasonNum;
  epList.innerHTML = '<div class="ep-loading">Cargando episodios…</div>';
  epList.classList.add('open');
  try {
    const r = await fetch(`https://api.themoviedb.org/3/tv/${tvId}/season/${seasonNum}?api_key=${TMDB_KEY}&language=es-ES`);
    const d = await r.json();
    const episodes = d.episodes || [];
    epList.innerHTML = '';
    if (!episodes.length) {
      epList.innerHTML = '<div class="ep-loading">Sin episodios disponibles.</div>';
      return;
    }
    const seriesSlug = (currentDetailTitle || '').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
    // Check if Cuevana is in platforms
    const cuevanaPlat = platforms.find(p => p.domain === 'cuevana.bi');

    episodes.forEach(ep => {
      const row = document.createElement('div');
      row.className = 'episode-row';
      row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:8px;';
      const cuevanaUrl = `https://cuevana.bi/serie/${seriesSlug}/episodio-${seasonNum}x${ep.episode_number}`;
      const pelisflixUrl  = `https://pelisflix1.homes/episodio/${seriesSlug}-${seasonNum}x${ep.episode_number}/`;
      const hdfullUrl     = `https://hdfull.org/serie/${seriesSlug}/temporada-${seasonNum}/episodio-${ep.episode_number}`;
      const pelisplushUrl = `https://www.pelisplushd.ms/serie/${seriesSlug}/temporada/${seasonNum}/capitulo/${ep.episode_number}`;
      const epNum = ep.episode_number;
      const epName = ep.name || 'Episodio ' + epNum;
      const epOverview = ep.overview || '';
      const epRuntime = ep.runtime ? `${ep.runtime}m` : '';
      const epDate = ep.air_date ? new Date(ep.air_date).toLocaleDateString('es-AR', {day:'numeric',month:'short',year:'numeric'}) : '';
      const epThumb = ep.still_path
        ? `<img class="ep-thumb" src="https://image.tmdb.org/t/p/w300${ep.still_path}" alt="${epName}" loading="lazy">`
        : `<div class="ep-thumb-placeholder">🎬</div>`;
      // Build row content based on mode
      const isWatched = getWatched().includes(seasonNum + 'x' + epNum);
      const pelispediaUrl = `https://pelispedia.mov/search?s=${encodeURIComponent(currentDetailTitle||'')}`;
      const playBtnHtml = histMode ? '' : `<button class="ep-play-btn ready"
        data-cuevana="${cuevanaUrl}" data-pelisflix="${pelisflixUrl}"
        data-hdfull="${hdfullUrl}" data-pelisplushd="${pelisplushUrl}"
        data-pelispedia="${pelispediaUrl}"
        title="Reproducir con Vimeus">▶</button>`;
      // Eye: only shown in normal mode (not historial), only clickeable to UNWATCH (not to watch manually)
      const eyeHtml = histMode
        ? (isWatched ? '<span class="ep-eye-btn watched" style="pointer-events:none;cursor:default;background:none;border:none;font-size:16px;">👁</span>' : '')
        : ('<button class="ep-eye-btn' + (isWatched ? ' watched' : '') + '" title="' + (isWatched ? 'Desmarcar' : 'Solo se marca al reproducir') + '" ' + (isWatched ? '' : 'style="opacity:.3;cursor:default;"') + '>👁</button>');

      row.innerHTML = `
        ${epThumb}
        <div class="ep-info">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span class="ep-num">${epNum}</span>
            ${playBtnHtml}
            <span class="ep-name">${epName}</span>
            <span style="margin-left:auto;">${eyeHtml}</span>
          </div>
          ${epDate || epRuntime ? `<div class="ep-meta">${[epDate, epRuntime].filter(Boolean).join(' · ')}</div>` : ''}
          ${epOverview ? `<div class="ep-overview">${epOverview.slice(0,160)}${epOverview.length>160?'…':''}</div>` : ''}
        </div>`;

      if (!histMode) {
        const noEmbedPlatforms = new Set(['hdfull', 'pelispedia']);
        row.querySelector('.ep-play-btn')?.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (activePlatform && activePlatform !== 'vimeus') {
            // VER EN override
            const urls = {
              cuevana:    e.currentTarget.dataset.cuevana,
              pelisflix:  e.currentTarget.dataset.pelisflix,
              hdfull:     e.currentTarget.dataset.hdfull,
              pelisplushd:e.currentTarget.dataset.pelisplushd,
              pelispedia: e.currentTarget.dataset.pelispedia,
            };
            const url = urls[activePlatform];
            if (url) {
              if (noEmbedPlatforms.has(activePlatform)) window.open(url, '_blank');
              else openEpisodePlayer(url, `${currentDetailTitle} — T${seasonNum}E${epNum}`, activePlatform);
            }
          } else {
            // Default: Vimeus
            const vimeusUrl = `https://vimeus.com/e/serie?tmdb=${currentDetailId}&se=${seasonNum}&ep=${epNum}&view_key=${VIMEUS_KEY}&theme=cosmic&loader=v3&font=v3&overlay=v5&playUI=v3&splash=v3`;
            openEpisodePlayer(vimeusUrl, `${currentDetailTitle} — T${seasonNum}E${epNum}`, 'Vimeus');
          }
          // Guardar en Continuar viendo
          addToContinue({
            id: currentDetailId, title: currentDetailTitle,
            poster: currentDetailPoster, type: 'tv', year: currentDetailYear,
            season: seasonNum, episode: epNum,
            totalEps: episodes.length
          });
          if (!getWatched().includes(seasonNum + 'x' + epNum)) {
            const eyeBtn = row.querySelector('.ep-eye-btn');
            await toggleWatched(seasonNum, epNum, eyeBtn);
          }
        });
        // Eye: only clickeable when already watched (to unwatch)
        const eyeBtn = row.querySelector('.ep-eye-btn');
        if (eyeBtn && isWatched) {
          eyeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleWatched(seasonNum, ep.episode_number, e.currentTarget);
          });
        }
      }
      epList.appendChild(row);
    });
  } catch(e) {
    epList.innerHTML = '<div class="ep-loading">Error al cargar episodios.</div>';
  }
}

function getWatchedKey() {
  return `watched_${currentDetailId || 'x'}`;
}
function getWatched() {
  const key = getWatchedKey();
  if (window._fbUser && window._watchedCache) return window._watchedCache[key] || [];
  try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) { return []; }
}
async function toggleWatched(seasonNum, epNum, btn) {
  const key = getWatchedKey();
  const epId = `${seasonNum}x${epNum}`;
  let watched = getWatched();
  const idx = watched.indexOf(epId);
  if (idx >= 0) {
    watched.splice(idx, 1);
    if (btn) { btn.classList.remove('watched'); btn.title = 'Marcar como visto'; }
  } else {
    watched.push(epId);
    if (btn) { btn.classList.add('watched'); btn.title = 'Marcar como no visto'; }
    // Add to historial
    await addToHistorial({
      id: currentDetailId, title: currentDetailTitle,
      poster: currentDetailPoster, type: 'tv',
      year: currentDetailYear, season: seasonNum, episode: epNum,
      date: new Date().toISOString()
    });
  }
  localStorage.setItem(key, JSON.stringify(watched));
  if (window._fbUser && window._fbDb && window._fbDoc && window._fbSetDoc) {
    try {
      if (!window._watchedCache) window._watchedCache = {};
      window._watchedCache[key] = watched;
      const ref = window._fbDoc(window._fbDb, 'watched', window._fbUser.uid);
      await window._fbSetDoc(ref, { data: window._watchedCache }, { merge: true });
    } catch(e) { console.error('Error guardando visto:', e); }
  }
}

// ── HISTORIAL ────────────────────────────────────────────
function getHistorial() {
  if (window._fbUser && window._historialCache) return window._historialCache;
  try { return JSON.parse(localStorage.getItem('movara_historial') || '[]'); } catch(e) { return []; }
}
async function addToHistorial(entry) {
  let hist = getHistorial();
  // Dedupe: for series keep per-episode, for movies keep one entry
  if (entry.type === 'movie') {
    hist = hist.filter(h => h.id !== entry.id);
  }
  hist.unshift(entry); // newest first
  hist = hist.slice(0, 200); // cap
  localStorage.setItem('movara_historial', JSON.stringify(hist));
  if (window._fbUser && window._fbDb && window._fbDoc && window._fbSetDoc) {
    try {
      window._historialCache = hist;
      const ref = window._fbDoc(window._fbDb, 'historial', window._fbUser.uid);
      await window._fbSetDoc(ref, { items: hist }, { merge: false });
    } catch(e) { console.error('Historial save error:', e); }
  }
}
async function loadHistorialFromCloud() {
  if (!window._fbUser || !window._fbDb) return;
  try {
    const ref = window._fbDoc(window._fbDb, 'historial', window._fbUser.uid);
    const snap = await window._fbGetDoc(ref);
    window._historialCache = snap.exists() ? (snap.data().items || []) : [];
  } catch(e) { window._historialCache = []; }
}
async function loadWatchedFromCloud() {
  if (!window._fbUser || !window._fbDb) return;
  try {
    const ref = window._fbDoc(window._fbDb, 'watched', window._fbUser.uid);
    const snap = await window._fbGetDoc(ref);
    window._watchedCache = snap.exists() ? (snap.data().data || {}) : {};
  } catch(e) { window._watchedCache = {}; }
}

let recsLoaded = false;
let recsVisible = false;
let currentMediaIdForRecs = null;

let recsPage = 1;
let recsAllItems = [];

async function toggleRecs() {
  const section = document.getElementById('recsSection');
  const grid = document.getElementById('recsGrid');
  if (!section) return;
  recsVisible = !recsVisible;
  section.style.display = recsVisible ? 'block' : 'none';
  document.getElementById('recsBtn').style.background = recsVisible ? '#1d4ed8' : '#2563eb';
  if (recsVisible && !recsLoaded) {
    recsLoaded = true;
    recsPage = 1;
    recsAllItems = [];
    grid.innerHTML = '<div class="ep-loading">Cargando…</div>';
    try {
      const mt = currentMediaType;
      const id = currentMediaIdForRecs;
      const title = currentDetailTitle || '';
      // Fetch recommendations + same-name search in parallel
      const [recR, searchR] = await Promise.all([
        fetch(`https://api.themoviedb.org/3/${mt}/${id}/recommendations?api_key=${TMDB_KEY}&language=es-ES&page=1`).then(r=>r.json()),
        title ? fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&language=es-ES&query=${encodeURIComponent(title)}&page=1`).then(r=>r.json()) : Promise.resolve({results:[]}),
      ]);
      // Same-name results (exclude current item, sort by date desc)
      const sameName = (searchR.results||[])
        .filter(x => x.poster_path && x.id !== id && (x.media_type === 'movie' || x.media_type === 'tv'))
        .sort((a,b) => ((b.release_date||b.first_air_date||'')).localeCompare((a.release_date||a.first_air_date||'')));
      const recs = (recR.results||[]).filter(x => x.poster_path);
      // Merge: same-name first (deduped), then recs
      const seen = new Set(sameName.map(x=>x.id));
      seen.add(id);
      const merged = [...sameName, ...recs.filter(x => !seen.has(x.id))];
      recsAllItems = merged;
      if (!merged.length) { grid.innerHTML = '<div class="ep-loading">Sin recomendaciones disponibles.</div>'; return; }
      grid.innerHTML = '';
      renderRecsPage(grid);
    } catch(e) {
      grid.innerHTML = '<div class="ep-loading">Error al cargar recomendaciones.</div>';
    }
  }
}

function renderRecsPage(grid) {
  const PAGE = 12;
  const slice = recsAllItems.slice(0, recsPage * PAGE);
  grid.innerHTML = '';
  renderBrowseGrid(grid, slice, null, null);
  // Ver más button
  let moreBtn = document.getElementById('recsMoreBtn');
  if (!moreBtn) {
    moreBtn = document.createElement('div');
    moreBtn.id = 'recsMoreBtn';
    moreBtn.style.cssText = 'text-align:center;margin-top:14px;';
    grid.parentElement.appendChild(moreBtn);
  }
  if (recsPage * PAGE < recsAllItems.length) {
    moreBtn.innerHTML = '<button class="home-tab" style="margin:0 auto;" onclick="recsPage++;renderRecsPage(document.getElementById(&quot;recsGrid&quot;))">Ver más</button>';
  } else {
    moreBtn.innerHTML = '';
  }
}

async function translateBio(text) {
  if (!text) return null;
  try {
    // MyMemory: API gratuita de traducción, sin key requerida
    const chunks = [];
    // Dividir en chunks de 500 chars (límite de MyMemory)
    for (let i = 0; i < Math.min(text.length, 1500); i += 450) {
      chunks.push(text.slice(i, i + 450));
    }
    const translated = await Promise.all(chunks.map(async chunk => {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunk)}&langpair=en|es`;
      const r = await fetch(url);
      const d = await r.json();
      return d.responseData?.translatedText || chunk;
    }));
    return translated.join(' ');
  } catch(e) {
    return null;
  }
}

async function renderPersonCard(person) {
  const container = document.getElementById('container');
  container.innerHTML = `<div class="state-msg"><div class="spinner"></div> Cargando perfil de ${person.name || 'actor'}…</div>`;
  
  if (!person.id) {
    container.innerHTML = `<div class="state-msg" style="text-align:center;padding:40px;">
      <div style="font-size:32px;margin-bottom:12px;">😕</div>
      <div style="color:var(--t1);font-weight:600;margin-bottom:6px;">No se pudo cargar el perfil</div>
      <div style="color:var(--t3);font-size:13px;">ID de persona no encontrado.</div>
    </div>`;
    return;
  }

  const photoUrl = person.profile_path ? `https://image.tmdb.org/t/p/w342${person.profile_path}` : '';

  let det, detEN, cred;
  try {
    const [r1, r2, r3] = await Promise.all([
      fetch(`https://api.themoviedb.org/3/person/${person.id}?api_key=${TMDB_KEY}&language=es-ES`),
      fetch(`https://api.themoviedb.org/3/person/${person.id}?api_key=${TMDB_KEY}&language=en-US`),
      fetch(`https://api.themoviedb.org/3/person/${person.id}/combined_credits?api_key=${TMDB_KEY}&language=es-ES`),
    ]);
    if (!r1.ok) throw new Error(`TMDB respondió ${r1.status}`);
    [det, detEN, cred] = await Promise.all([r1.json(), r2.json(), r3.json()]);
  } catch(e) {
    console.error('renderPersonCard fetch error:', e);
    container.innerHTML = `<div class="state-msg" style="text-align:center;padding:40px;">
      <div style="font-size:32px;margin-bottom:12px;">😕</div>
      <div style="color:var(--t1);font-weight:600;margin-bottom:6px;">No se pudo cargar el perfil</div>
      <div style="color:var(--t3);font-size:13px;">${e.message || 'Error desconocido'}</div>
      <div style="color:#666;font-size:10px;margin-top:8px;font-family:monospace;">ID: ${person.id} · ${e.name || ''}</div>
    </div>`;
    return;
  }

  // Always prefer Spanish bio; if missing or too short, translate English
  const esBio = det.biography || '';
  const enBio = detEN.biography || '';
  let bio;
  if (esBio.length > 80) {
    bio = esBio;
  } else if (enBio.length > 0) {
    bio = await translateBio(enBio) || enBio;
  } else {
    bio = 'Sin biografía disponible.';
  }
  const known = det.known_for_department || '';
  const birthday = det.birthday ? det.birthday.split('-').reverse().join('/') : null;
  const birthplace = det.place_of_birth || null;
  const metaTags = [
    known ? known : null,
    birthday ? `🎂 ${birthday}` : null,
    birthplace ? `📍 ${birthplace}` : null,
  ].filter(Boolean);

  const credits = [...(cred.cast || [])]
    .filter(x => x.poster_path)
    .sort((a,b) => {
      const yearA = parseInt((a.release_date || a.first_air_date || '0').slice(0,4)) || 0;
      const yearB = parseInt((b.release_date || b.first_air_date || '0').slice(0,4)) || 0;
      return yearB - yearA;
    })
    .slice(0, 25);

  // Fetch season counts for TV items
  const tvIds = [...new Set(credits.filter(x => x.media_type === 'tv').map(x => x.id))];
  const seasonMap = {};
  await Promise.all(tvIds.slice(0, 10).map(async id => {
    try {
      const r = await fetch(`https://api.themoviedb.org/3/tv/${id}?api_key=${TMDB_KEY}&language=es-ES`);
      const d = await r.json();
      if (d.number_of_seasons) seasonMap[id] = d.number_of_seasons;
    } catch(e) {}
  }));

  container.innerHTML = `
  <div class="person-card">
    <div class="person-top">
      ${photoUrl ? `
      <div class="person-photo-col">
        <img class="person-photo" src="${photoUrl}" alt="${person.name}">
        <div class="person-photo-overlay"></div>
      </div>` : ''}
      <div class="person-details">
        <div class="person-name">${person.name}</div>
        <div class="person-meta">
          ${metaTags.map(t => `<span class="person-meta-tag">${t}</span>`).join('')}
        </div>
        <div class="person-bio">${bio.slice(0, 900)}${bio.length > 900 ? '…' : ''}</div>
      </div>
    </div>
    <div class="person-films-section">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
        <div class="person-films-label" style="margin:0;">Filmografía</div>
        <button class="home-tab active" id="pfTabAll"  onclick="filterPersonFilms('all')">Todos</button>
        <button class="home-tab"        id="pfTabMovie" onclick="filterPersonFilms('movie')">🎬 Películas</button>
        <button class="home-tab"        id="pfTabTv"    onclick="filterPersonFilms('tv')">📺 Series</button>
      </div>
      <div class="browse-grid" id="personFilms"></div>
      <div style="text-align:center;margin-top:16px;display:none;" id="pfShowMore">
        <button class="home-tab" onclick="showMorePersonFilms()" style="margin:0 auto;">Mostrar más</button>
      </div>
    </div>
  </div>`;

  // Store credits globally for filter
  window._personCredits = credits;
  window._personSeasonMap = seasonMap;
  window._pfFilter = 'all';
  window._pfPage = 0;
  renderPersonFilms();
}
